asyncapi: 3.1.0
info:
  title: Payment 실행 결과
  version: 3.0.0
defaultContentType: application/json
channels:
  results:
    address: payment.execution.results.v1
    description: Kafka key와 aggregateId는 orderRef. Payment가 토스 승인을 반영하는 트랜잭션에서 상태(APPROVED)·승인
      분개와 함께 common Outbox에 기록한다. 같은 결제의 승인은 한 번만 반영되므로 정상이라면 결제마다 1건이지만, 릴레이는 최소 1회
      전달이라 소비자는 paymentId로 중복을 걸러야 한다. 2.0.0에서 옛 PaymentExecutionResolved(requestId 키)를 지우고
      PaymentApproved로 교체했다(호환 깨짐, #338).
      3.0.0에서 토픽을 점 표기 payment.execution.results.v1로 바꿨다(#385). Core #378은 점·하이픈 두 토픽을 모두 소비한다.
    messages:
      PaymentApproved:
        $ref: '#/components/messages/PaymentApproved'
operations:
  publishResult:
    action: send
    channel:
      $ref: '#/channels/results'
    messages:
    - $ref: '#/channels/results/messages/PaymentApproved'
components:
  schemas:
    Timestamp:
      type: string
      format: date-time
    PositiveId:
      type: integer
      format: int64
      minimum: 1
    OrderRef:
      type: string
      minLength: 6
      maxLength: 50
  messages:
    PaymentApproved:
      name: PaymentApproved
      summary: 토스 승인이 확정돼 결제가 APPROVED가 됐다.
      payload:
        type: object
        additionalProperties: false
        required:
        - eventId
        - eventType
        - schemaVersion
        - source
        - aggregateId
        - occurredAt
        - payload
        properties:
          eventId:
            type: string
            format: uuid
          eventType:
            const: PaymentApproved
          schemaVersion:
            const: 1
          source:
            const: payment-service
          aggregateId:
            $ref: '#/components/schemas/OrderRef'
          occurredAt:
            $ref: '#/components/schemas/Timestamp'
          payload:
            type: object
            additionalProperties: false
            required:
            - paymentId
            - orderRef
            - amount
            - approvedAt
            properties:
              paymentId:
                $ref: '#/components/schemas/PositiveId'
              orderRef:
                $ref: '#/components/schemas/OrderRef'
              amount:
                type: integer
                format: int64
                minimum: 1
              approvedAt:
                $ref: '#/components/schemas/Timestamp'
      examples:
      - payload:
          eventId: 8f0c2d4e-6b1a-4c3e-9f7d-2a5b8c1e0d93
          eventType: PaymentApproved
          schemaVersion: 1
          source: payment-service
          aggregateId: OD-20261110-K7Q2M9XA
          occurredAt: '2026-11-10T05:02:12Z'
          payload:
            paymentId: 1001
            orderRef: OD-20261110-K7Q2M9XA
            amount: 30000
            approvedAt: '2026-11-10T05:02:11Z'
