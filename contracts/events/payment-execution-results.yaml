asyncapi: 3.1.0
info:
  title: Payment 실행 결과
  version: 1.0.0
defaultContentType: application/json
channels:
  results:
    address: payment.execution-results.v1
    description: Kafka key와 aggregateId는 requestId. Payment 실행 확정과 common Outbox append를
      같은 트랜잭션에 기록한다. Core는 영속 원문과 식별자·대상·금액·상태·시각을 검증해 중복 결과를 멱등 적용한다. 결과 선도착도 requestId로
      복구한다. Core 로컬 반영 실패는 이벤트를 ack하지 않는다. 기존 알림 토픽은 Core만 생산한다.
    messages:
      PaymentExecutionResolved:
        $ref: '#/components/messages/PaymentExecutionResolved'
operations:
  publishResult:
    action: send
    channel:
      $ref: '#/channels/results'
    messages:
    - $ref: '#/channels/results/messages/PaymentExecutionResolved'
components:
  schemas:
    Timestamp:
      type: string
      format: date-time
    PositiveId:
      type: integer
      format: int64
      minimum: 1
  messages:
    PaymentExecutionResolved:
      name: PaymentExecutionResolved
      payload:
        type: object
        additionalProperties: false
        required:
        - eventId
        - eventType
        - schemaVersion
        - source
        - aggregateId
        - occurredAt
        - payload
        properties:
          eventId:
            type: string
            format: uuid
          eventType:
            const: PaymentExecutionResolved
          schemaVersion:
            const: 1
          source:
            const: payment-service
          aggregateId:
            type: string
            format: uuid
          occurredAt:
            $ref: '#/components/schemas/Timestamp'
          payload:
            type: object
            additionalProperties: false
            required:
            - requestId
            - paymentId
            - orderId
            - paymentGroupId
            - referenceNumber
            - amount
            - scenario
            - status
            - requestedAt
            - resolvedAt
            - scheduledResolveAt
            properties:
              requestId:
                type: string
                format: uuid
              paymentId:
                $ref: '#/components/schemas/PositiveId'
              orderId:
                $ref: '#/components/schemas/PositiveId'
              paymentGroupId:
                anyOf:
                - {$ref: '#/components/schemas/PositiveId'}
                - type: 'null'
              referenceNumber:
                type: string
                minLength: 1
                maxLength: 64
              amount:
                type: integer
                format: int64
                minimum: 0
              scenario:
                type: string
                enum:
                - INSTANT_SUCCESS
                - INSTANT_FAIL
                - DELAYED_SUCCESS
                - DELAYED_FAIL
                - SUCCESS_RESPONSE_LOST
                - FAILURE_RESPONSE_LOST
                - UNAVAILABLE_BEFORE_RESULT
              status:
                enum:
                - SUCCESS
                - FAILED
              requestedAt:
                $ref: '#/components/schemas/Timestamp'
              resolvedAt:
                $ref: '#/components/schemas/Timestamp'
              scheduledResolveAt:
                $ref: '#/components/schemas/Timestamp'
      examples:
      - payload:
          eventId: b1111111-1111-4111-8111-111111111111
          eventType: PaymentExecutionResolved
          schemaVersion: 1
          source: payment-service
          aggregateId: a1111111-1111-4111-8111-111111111111
          occurredAt: '2026-11-09T00:00:01Z'
          payload:
            requestId: a1111111-1111-4111-8111-111111111111
            paymentId: 7
            orderId: 1
            paymentGroupId: 1
            referenceNumber: PG-11111111-1111-4111-8111-111111111111
            amount: 1000
            status: SUCCESS
            requestedAt: '2026-11-09T00:00:00Z'
            resolvedAt: '2026-11-09T00:00:01Z'
            scenario: INSTANT_SUCCESS
            scheduledResolveAt: '2026-11-09T00:00:00Z'
