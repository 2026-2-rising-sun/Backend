                  - amount
                  properties:
                    orderNumber:
                      type: string
                      minLength: 1
                    productName:
                      type: string
                      minLength: 1
                      maxLength: 255
                    amount:
                      type: integer
                      minimum: 0
              expiresAt:
                type: string
                format: date-time
              paymentId:
                type: integer
                format: int64
                minimum: 1
              attemptedAmount:
                type: integer
                format: int64
                minimum: 0
              failureCode:
                type: string
                enum:
                - TIMEOUT
                - REJECTED
      examples:
