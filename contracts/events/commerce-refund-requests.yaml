asyncapi: 3.1.0
info:
  title: Commerce 공통 사용자 환불·시스템 보상 요청
  version: 2.0.0
defaultContentType: application/json
channels:
  events:
    address: commerce.refund.requests.v1
    description: Kafka key = aggregateId = payload.orderRef. refundRequestId는 최초 접수 때 고정한다. 동일 ID·같은 정규화 본문은 재전송이며
      다른 본문은 충돌이다. USER_REFUND에는 paymentId가 필수이고 승인 전 SYSTEM_COMPENSATION에는 생략 가능하다. 항목·판매자·전체 금액 합계 및 중복 ID는 소비자가
      추가 검증한다. 최소 금액 단위는 1 KRW, 반올림·현재 가격 재계산 금지. 상태·원문·Outbox 동시 커밋, PG 호출은 DB 트랜잭션 밖. 구 하이픈 토픽의 schemaVersion=1
      late-* 전용 메시지와 호환되지 않는 새 토픽 계약이다.
    messages:
      RefundRequested:
        $ref: '#/components/messages/RefundRequested'
operations:
  publishEvent:
    action: send
    channel:
      $ref: '#/channels/events'
    messages:
    - $ref: '#/channels/events/messages/RefundRequested'
components:
  messages:
    RefundRequested:
      name: RefundRequested
      bindings:
        kafka:
          key: &id001
            type: string
            pattern: ^[A-Za-z0-9_-]{6,50}$
          bindingVersion: 0.5.0
      payload:
        type: object
        additionalProperties: false
        required:
        - eventId
        - eventType
        - schemaVersion
        - source
        - aggregateId
        - occurredAt
        - payload
        properties:
          eventId:
            type: string
            format: uuid
          eventType:
            const: RefundRequested
          schemaVersion:
            const: 1
          source:
            const: commercecore-service
          aggregateId: *id001
          occurredAt: &id002
            type: string
            format: date-time
          payload:
            $ref: '#/components/schemas/RefundRequest'
      examples:
      - name: 사용자부분수량
        payload:
          eventId: 11111111-1111-4111-8111-000000000001
          eventType: RefundRequested
          schemaVersion: 1
          source: commercecore-service
          aggregateId: PG-22222222-2222-4222-8222-222222222222
          occurredAt: '2026-11-19T01:00:00Z'
          payload:
            refundRequestId: a1111111-1111-4111-8111-111111111111
            orderRef: PG-22222222-2222-4222-8222-222222222222
            paymentId: 7001
            purpose: USER_REFUND
            reason: CUSTOMER_REQUEST
            currency: KRW
            amount: 4000
            items:
            - sellerOrderNumber: ORDER-301
              amount: 4000
              orderItems:
              - orderItemId: 301
                quantity: 1
                amount: 4000
            requestedAt: '2026-11-19T00:59:59Z'
      - name: 승인전시스템보상
        payload:
          eventId: 11111111-1111-4111-8111-000000000002
          eventType: RefundRequested
          schemaVersion: 1
          source: commercecore-service
          aggregateId: PG-22222222-2222-4222-8222-222222222222
          occurredAt: '2026-11-19T01:00:00Z'
          payload:
            refundRequestId: b1111111-1111-4111-8111-111111111111
            orderRef: PG-22222222-2222-4222-8222-222222222222
            purpose: SYSTEM_COMPENSATION
            reason: APPROVAL_UNKNOWN
            currency: KRW
            amount: 4000
            items:
            - sellerOrderNumber: ORDER-301
              amount: 4000
              orderItems:
              - orderItemId: 301
                quantity: 1
                amount: 4000
            requestedAt: '2026-11-19T00:59:59Z'
      - name: 기존고정ID를유지한변환
        payload:
          eventId: 11111111-1111-4111-8111-000000000003
          eventType: RefundRequested
          schemaVersion: 1
          source: commercecore-service
          aggregateId: PG-22222222-2222-4222-8222-222222222222
          occurredAt: '2026-11-19T01:00:00Z'
          payload:
            refundRequestId: late-7001
            orderRef: PG-22222222-2222-4222-8222-222222222222
            purpose: SYSTEM_COMPENSATION
            reason: LATE_APPROVAL
            currency: KRW
            amount: 4000
            items:
            - sellerOrderNumber: ORDER-301
              amount: 4000
              orderItems:
              - orderItemId: 301
                quantity: 1
                amount: 4000
            requestedAt: '2026-11-19T00:59:59Z'
            paymentId: 7001
  schemas:
    OrderRef: *id001
    Money:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
    PositiveId:
      type: integer
      format: int64
      minimum: 1
    Timestamp: *id002
    RefundRequestId:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,64}$
    RefundOrderItem:
      type: object
      additionalProperties: false
      required:
      - orderItemId
      - quantity
      - amount
      properties:
        orderItemId:
          $ref: '#/components/schemas/PositiveId'
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
        amount:
          $ref: '#/components/schemas/Money'
    RefundSellerItem:
      type: object
      additionalProperties: false
      required:
      - sellerOrderNumber
      - amount
      - orderItems
      properties:
        sellerOrderNumber:
          type: string
          minLength: 1
          maxLength: 64
        amount:
          $ref: '#/components/schemas/Money'
        orderItems:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RefundOrderItem'
    RefundRequest:
      type: object
      additionalProperties: false
      required:
      - refundRequestId
      - orderRef
      - purpose
      - reason
      - currency
      - amount
      - items
      - requestedAt
      properties:
        refundRequestId:
          $ref: '#/components/schemas/RefundRequestId'
        orderRef:
          $ref: '#/components/schemas/OrderRef'
        paymentId:
          $ref: '#/components/schemas/PositiveId'
        purpose:
          enum:
          - USER_REFUND
          - SYSTEM_COMPENSATION
        reason:
          enum:
          - CUSTOMER_REQUEST
          - APPROVAL_RESPONSE_LOST
          - APPROVAL_UNKNOWN
          - LATE_APPROVAL
          - ORDER_EXPIRED
          - ORDER_CANCELLED
        currency:
          const: KRW
        amount:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RefundSellerItem'
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
      allOf:
      - if:
          properties:
            purpose:
              const: USER_REFUND
          required:
          - purpose
        then:
          required:
          - paymentId
          properties:
            reason:
              const: CUSTOMER_REQUEST
        else:
          properties:
            reason:
              enum:
              - APPROVAL_RESPONSE_LOST
              - APPROVAL_UNKNOWN
              - LATE_APPROVAL
              - ORDER_EXPIRED
              - ORDER_CANCELLED
