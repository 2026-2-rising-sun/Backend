asyncapi: 3.1.0
info:
  title: Commerce 늦은 승인 환불 요청
  version: 1.0.0
defaultContentType: application/json
channels:
  refundRequests:
    address: commerce.refund-requests.v1
    description: 팀원 Payment 목표 계약의 LATE_APPROVAL 요청. Kafka key와 aggregateId는 orderRef다. Core 환불 필요 기록과 같은 트랜잭션의 Outbox에 저장한다. 실제 Payment 소비자 구현·실행 검증은 별도이며 발행 성공은 환불 완료가 아니다.
    messages:
      RefundRequested:
        $ref: '#/components/messages/RefundRequested'
operations:
  publishRefundRequested:
    action: send
    channel:
      $ref: '#/channels/refundRequests'
    messages:
    - $ref: '#/channels/refundRequests/messages/RefundRequested'
components:
  schemas:
    OrderRef:
      type: string
      pattern: ^[A-Za-z0-9_-]{6,50}$
  messages:
    RefundRequested:
      name: RefundRequested
      payload:
        type: object
        additionalProperties: false
        required: [eventId, eventType, schemaVersion, source, aggregateId, occurredAt, payload]
        properties:
          eventId: {type: string, format: uuid}
          eventType: {const: RefundRequested}
          schemaVersion: {const: 1}
          source: {const: commercecore-service}
          aggregateId: {$ref: '#/components/schemas/OrderRef'}
          occurredAt: {type: string, format: date-time}
          payload:
            type: object
            additionalProperties: false
            required: [refundRequestId, paymentId, orderRef, reason]
            properties:
              refundRequestId: {type: string, pattern: '^late-[1-9][0-9]*$'}
              paymentId: {type: integer, format: int64, minimum: 1}
              orderRef: {$ref: '#/components/schemas/OrderRef'}
              reason: {const: LATE_APPROVAL}
      examples:
      - name: 늦은승인전액환불요청
        payload:
          eventId: 11111111-1111-4111-8111-111111111111
          eventType: RefundRequested
          schemaVersion: 1
          source: commercecore-service
          aggregateId: PG-22222222-2222-4222-8222-222222222222
          occurredAt: '2026-11-16T01:20:00Z'
          payload:
            refundRequestId: late-7001
            paymentId: 7001
            orderRef: PG-22222222-2222-4222-8222-222222222222
            reason: LATE_APPROVAL
