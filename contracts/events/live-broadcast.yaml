asyncapi: 3.1.0
info:
  title: Live 방송 이벤트 계약
  version: 1.0.0
  description: 방송 일정·시작·종료와 프로모션 열림·닫힘 이벤트 계약.
defaultContentType: application/json
channels:
  broadcast:
    address: live.broadcast.v1
    description: |-
      Kafka key와 aggregateId는 payload.broadcastId의 10진수 문자열이다.
      Kafka 헤더 eventId·eventType은 봉투의 같은 필드 값을 UTF-8 문자열로 전달한다.
      상태 변경과 같은 트랜잭션의 Outbox에 기록하며 중복 전달과 순서 역전이 가능하다. eventId로 중복을 식별한다.
      방송 상태는 broadcastId별 broadcastVersion, 프로모션 상태는 promotionId별 promotionVersion이 기존 값보다 클 때 반영한다.
      서로 다른 대상의 버전은 비교하지 않는다. 모르는 eventType은 무시한다.
      방송 종료 시 열린 프로모션의 Closed 이벤트를 Ended보다 먼저 기록하지만 도착 순서는 보장하지 않는다.
    messages:
      LiveBroadcastScheduled:
        $ref: '#/components/messages/LiveBroadcastScheduled'
      LiveBroadcastStarted:
        $ref: '#/components/messages/LiveBroadcastStarted'
      LiveBroadcastEnded:
        $ref: '#/components/messages/LiveBroadcastEnded'
      LiveBroadcastPromotionOpened:
        $ref: '#/components/messages/LiveBroadcastPromotionOpened'
      LiveBroadcastPromotionClosed:
        $ref: '#/components/messages/LiveBroadcastPromotionClosed'
operations:
  publishBroadcast:
    action: send
    channel:
      $ref: '#/channels/broadcast'
    messages:
    - $ref: '#/channels/broadcast/messages/LiveBroadcastScheduled'
    - $ref: '#/channels/broadcast/messages/LiveBroadcastStarted'
    - $ref: '#/channels/broadcast/messages/LiveBroadcastEnded'
    - $ref: '#/channels/broadcast/messages/LiveBroadcastPromotionOpened'
    - $ref: '#/channels/broadcast/messages/LiveBroadcastPromotionClosed'
components:
  schemas:
    EventEnvelope:
      type: object
      description: '도메인 payload와 독립적인 공통 봉투. 필수값은 null일 수 없다.

        eventType·source·aggregateId는 공백만으로 구성될 수 없다.

        '
      required:
      - eventId
      - eventType
      - schemaVersion
      - source
      - aggregateId
      - occurredAt
      - payload
      properties:
        eventId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: 표준 UUID 문자열. 동일 이벤트를 식별하며 순서를 나타내지 않는다.
        eventType:
          type: string
          minLength: 1
          pattern: \S
          description: 이벤트 종류를 식별하는 이름
        schemaVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: 이벤트 데이터 형식의 버전
        source:
          type: string
          minLength: 1
          pattern: \S
          description: 발행 서비스 이름
        aggregateId:
          type: string
          minLength: 1
          pattern: \S
          description: 방송 ID의 10진수 문자열. Kafka key와 payload.broadcastId가 가리키는 방송과 같다.
        occurredAt:
          type: string
          format: date-time
          description: ISO 8601 형식의 이벤트 발생 시각
        payload:
          not:
            type: 'null'
          description: 방송 또는 프로모션의 이벤트별 데이터.
    LiveBroadcastScheduledPayload:
      type: object
      required:
      - broadcastId
      - broadcastVersion
      - title
      - scheduledAt
      properties:
        broadcastId: &id001
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        broadcastVersion: &id002
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        title:
          type: string
        scheduledAt: &id003
          type: string
          format: date-time
    LiveBroadcastStartedPayload:
      type: object
      required:
      - broadcastId
      - broadcastVersion
      - title
      - scheduledAt
      - startedAt
      - productIds
      properties:
        broadcastId: *id001
        broadcastVersion: *id002
        title:
          type: string
        scheduledAt: *id003
        startedAt: *id003
        productIds:
          type: array
          description: 방송 시작 시점에 공개 가능한 ON_SALE·SOLD_OUT 연결 상품 ID. 노출 순서대로 전달한다.
          items: *id001
    LiveBroadcastEndedPayload:
      type: object
      required:
      - broadcastId
      - broadcastVersion
      - startedAt
      - endedAt
      properties:
        broadcastId: *id001
        broadcastVersion: *id002
        startedAt: *id003
        endedAt: *id003
        closedPromotionIds:
          type: array
          items: &id004
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          description: 방송 종료와 함께 닫힌 OPEN 프로모션 ID. 이전 이벤트에는 없을 수 있으며 없으면 빈 목록으로 처리한다.
    LiveBroadcastPromotionOpenedPayload:
      type: object
      required:
      - broadcastId
      - promotionId
      - promotionVersion
      - type
      - title
      - attributes
      - openedAt
      - closesAt
      properties:
        broadcastId: *id004
        promotionId: *id004
        promotionVersion: &id006
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        type: &id005
          type: string
          minLength: 1
          pattern: \S
        title: *id005
        attributes:
          type: object
          additionalProperties: true
        openedAt: &id008
          type: string
          format: date-time
        closesAt: &id007
          type:
          - string
          - 'null'
          format: date-time
    LiveBroadcastPromotionClosedPayload:
      type: object
      required:
      - broadcastId
      - promotionId
      - promotionVersion
      - type
      - reason
      - openedAt
      - closedAt
      properties:
        broadcastId: *id004
        promotionId: *id004
        promotionVersion: *id006
        type: *id005
        reason:
          type: string
          minLength: 1
          pattern: \S
          description: SELLER_CLOSED·EXPIRED·BROADCAST_ENDED. 모르는 값도 문자열로 받을 수 있다.
        openedAt: *id007
        closedAt: *id008
  messages:
    LiveBroadcastScheduled:
      name: LiveBroadcastScheduled
      summary: 방송 등록 또는 PREPARING 상태의 제목·예정 시각 변경. 동일 입력 재요청과 송출 정보만 변경한 요청에는 발행하지 않는다.
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: LiveBroadcastScheduled
            schemaVersion:
              const: 1
            source:
              const: live-service
            aggregateId:
              type: string
              pattern: ^[1-9][0-9]*$
            payload:
              $ref: '#/components/schemas/LiveBroadcastScheduledPayload'
      examples:
      - name: LiveBroadcastScheduled예시
        payload:
          eventId: c3d2e1f0-1a2b-4c3d-9e8f-7a6b5c4d3e21
          eventType: LiveBroadcastScheduled
          schemaVersion: 1
          source: live-service
          aggregateId: '42'
          occurredAt: '2026-10-25T12:01:05.482913Z'
          payload:
            broadcastId: 42
            broadcastVersion: 0
            title: 가을 신상 라이브
            scheduledAt: '2026-10-25T12:00:00Z'
    LiveBroadcastStarted:
      name: LiveBroadcastStarted
      summary: PREPARING에서 LIVE로 전이할 때 발행한다. 반복 시작 요청에는 발행하지 않는다.
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: LiveBroadcastStarted
            schemaVersion:
              const: 1
            source:
              const: live-service
            aggregateId:
              type: string
              pattern: ^[1-9][0-9]*$
            payload:
              $ref: '#/components/schemas/LiveBroadcastStartedPayload'
      examples:
      - name: LiveBroadcastStarted예시
        payload:
          eventId: c3d2e1f0-1a2b-4c3d-9e8f-7a6b5c4d3e22
          eventType: LiveBroadcastStarted
          schemaVersion: 1
          source: live-service
          aggregateId: '42'
          occurredAt: '2026-10-25T12:01:05.482913Z'
          payload:
            broadcastId: 42
            broadcastVersion: 2
            title: 가을 신상 라이브
            scheduledAt: '2026-10-25T12:00:00Z'
            startedAt: '2026-10-25T12:01:05.482913Z'
            productIds:
            - 101
            - 102
    LiveBroadcastEnded:
      name: LiveBroadcastEnded
      summary: LIVE에서 ENDED로 전이할 때 발행한다. 반복 종료 요청에는 발행하지 않는다.
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: LiveBroadcastEnded
            schemaVersion:
              const: 1
            source:
              const: live-service
            aggregateId:
              type: string
              pattern: ^[1-9][0-9]*$
            payload:
              $ref: '#/components/schemas/LiveBroadcastEndedPayload'
      examples:
      - name: LiveBroadcastEnded예시
        payload:
          eventId: c3d2e1f0-1a2b-4c3d-9e8f-7a6b5c4d3e23
          eventType: LiveBroadcastEnded
          schemaVersion: 1
          source: live-service
          aggregateId: '42'
          occurredAt: '2026-10-25T13:00:00Z'
          payload:
            broadcastId: 42
            broadcastVersion: 3
            startedAt: '2026-10-25T12:01:05.482913Z'
            endedAt: '2026-10-25T13:00:00Z'
            closedPromotionIds: []
    LiveBroadcastPromotionOpened:
      name: LiveBroadcastPromotionOpened
      summary: READY에서 OPEN으로 전이할 때 발행한다. 반복 열기 요청에는 발행하지 않는다.
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: LiveBroadcastPromotionOpened
            schemaVersion:
              const: 1
            source:
              const: live-service
            aggregateId:
              type: string
              pattern: ^[1-9][0-9]*$
            payload:
              $ref: '#/components/schemas/LiveBroadcastPromotionOpenedPayload'
      examples:
      - name: LiveBroadcastPromotionOpened예시
        payload:
          eventId: c3d2e1f0-1a2b-4c3d-9e8f-7a6b5c4d3e24
          eventType: LiveBroadcastPromotionOpened
          schemaVersion: 1
          source: live-service
          aggregateId: '42'
          occurredAt: '2026-10-25T12:10:00Z'
          payload:
            broadcastId: 42
            promotionId: 11
            promotionVersion: 1
            type: COUPON_DROP
            title: 쿠폰 안내
            attributes: {}
            openedAt: '2026-10-25T12:10:00Z'
            closesAt: '2026-10-25T12:15:00Z'
    LiveBroadcastPromotionClosed:
      name: LiveBroadcastPromotionClosed
      summary: 열렸던 프로모션의 수동 종료·시간 만료·방송 종료 시 발행한다. READY에서 바로 닫히거나 반복 닫기 요청이면 발행하지 않는다.
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: LiveBroadcastPromotionClosed
            schemaVersion:
              const: 1
            source:
              const: live-service
            aggregateId:
              type: string
              pattern: ^[1-9][0-9]*$
            payload:
              $ref: '#/components/schemas/LiveBroadcastPromotionClosedPayload'
      examples:
      - name: LiveBroadcastPromotionClosed예시
        payload:
          eventId: c3d2e1f0-1a2b-4c3d-9e8f-7a6b5c4d3e25
          eventType: LiveBroadcastPromotionClosed
          schemaVersion: 1
          source: live-service
          aggregateId: '42'
          occurredAt: '2026-10-25T12:15:00Z'
          payload:
            broadcastId: 42
            promotionId: 11
            promotionVersion: 2
            type: COUPON_DROP
            reason: EXPIRED
            openedAt: '2026-10-25T12:10:00Z'
            closedAt: '2026-10-25T12:15:00Z'
