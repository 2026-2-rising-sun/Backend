asyncapi: 3.1.0
info:
  title: Commerce 쿠폰 표시 이벤트 계약
  version: 1.0.0
  description: 'Kafka key와 aggregateId는 payload.couponId와 같은 opaque 문자열이다.

    생성은 버전 1, 성공한 설정 변경과 마지막 발급에 의한 수량 소진은 표시 버전을 증가시키며 전체 스냅샷을 기록한다.

    일반 발급, 재요청, 회원 쿠폰 예약·사용·해제·환불은 표시 상태를 바꾸지 않아 이벤트를 내지 않는다.

    같은 DB 트랜잭션의 Outbox로 기록하며 중복 전달과 역전 가능성이 있다. 소비자는 쿠폰별 기존 snapshotVersion보다 큰 버전만
    원자적으로 반영한다.

    productIds 전체를 교체하면서 제거된 연결도 삭제한다. occurredAt/eventId는 순서 판정에 쓰지 않는다.

    기간 경계의 별도 이벤트가 없으므로 표시 시 startsAt <= now < endsAt로 판단한다. 소진 상태도 표시 모델에 보존한다.

    이벤트 소비를 먼저 시작하고 Shopping 전용 GET /v1/internal/coupon-snapshots로 초기 적재·주기적 재동기화를
    수행한다.

    페이지 전체는 단일 시점 스냅샷이 아니다. 이벤트와 API에 같은 버전 규칙을 적용하고 이미 아는 쿠폰의 복구는 단건 API로 종료된 상태까지
    조회한다.

    소비자 구현은 별도 Shopping 작업이다. 이 계약과 생산자 테스트는 서비스 전체 E2E 완료를 뜻하지 않는다.'
defaultContentType: application/json
channels:
  couponInfo:
    address: commerce.coupon-info.v1
    description: 'Kafka key와 aggregateId는 payload.couponId와 같은 opaque 문자열이다.

      생성은 버전 1, 성공한 설정 변경과 마지막 발급에 의한 수량 소진은 표시 버전을 증가시키며 전체 스냅샷을 기록한다.

      일반 발급, 재요청, 회원 쿠폰 예약·사용·해제·환불은 표시 상태를 바꾸지 않아 이벤트를 내지 않는다.

      같은 DB 트랜잭션의 Outbox로 기록하며 중복 전달과 역전 가능성이 있다. 소비자는 쿠폰별 기존 snapshotVersion보다 큰
      버전만 원자적으로 반영한다.

      productIds 전체를 교체하면서 제거된 연결도 삭제한다. occurredAt/eventId는 순서 판정에 쓰지 않는다.

      기간 경계의 별도 이벤트가 없으므로 표시 시 startsAt <= now < endsAt로 판단한다. 소진 상태도 표시 모델에 보존한다.

      이벤트 소비를 먼저 시작하고 Shopping 전용 GET /v1/internal/coupon-snapshots로 초기 적재·주기적 재동기화를
      수행한다.

      페이지 전체는 단일 시점 스냅샷이 아니다. 이벤트와 API에 같은 버전 규칙을 적용하고 이미 아는 쿠폰의 복구는 단건 API로 종료된 상태까지
      조회한다.

      소비자 구현은 별도 Shopping 작업이다. 이 계약과 생산자 테스트는 서비스 전체 E2E 완료를 뜻하지 않는다.'
    messages:
      CouponCreated:
        $ref: '#/components/messages/CouponCreated'
      CouponUpdated:
        $ref: '#/components/messages/CouponUpdated'
      CouponSoldOut:
        $ref: '#/components/messages/CouponSoldOut'
operations:
  publishCouponInfo:
    action: send
    channel:
      $ref: '#/channels/couponInfo'
    messages:
    - $ref: '#/channels/couponInfo/messages/CouponCreated'
    - $ref: '#/channels/couponInfo/messages/CouponUpdated'
    - $ref: '#/channels/couponInfo/messages/CouponSoldOut'
components:
  messageTraits:
    couponInfo:
      bindings:
        kafka:
          key: &id002
            type: string
            minLength: 1
            maxLength: 36
            pattern: \S
            description: 기존 ID를 유지하는 opaque 문자열. UUID 형식으로 한정하지 않는다.
          bindingVersion: 0.5.0
  messages:
    CouponCreated:
      name: CouponCreated
      title: 쿠폰 생성
      traits:
      - $ref: '#/components/messageTraits/couponInfo'
      payload:
        allOf:
        - $ref: '#/components/schemas/CouponInfoEnvelope'
        - type: object
          properties:
            eventType:
              const: CouponCreated
      examples:
      - name: CouponCreated예시
        payload:
          eventId: 74b623b8-90ee-4f65-919c-d9ad2ea46fc1
          eventType: CouponCreated
          schemaVersion: 1
          source: commerce-service
          aggregateId: coupon-opaque-id
          occurredAt: '2026-10-14T09:00:00Z'
          payload:
            couponId: coupon-opaque-id
            snapshotVersion: 1
            name: 상품 할인 쿠폰
            fixedDiscount: 1000
            productIds: &id001
            - 501
            - 502
            startsAt: '2026-10-15T09:00:00Z'
            endsAt: '2026-10-16T09:00:00Z'
            expiresAt: '2026-10-17T09:00:00Z'
            soldOut: false
    CouponUpdated:
      name: CouponUpdated
      title: 쿠폰 설정 변경
      traits:
      - $ref: '#/components/messageTraits/couponInfo'
      payload:
        allOf:
        - $ref: '#/components/schemas/CouponInfoEnvelope'
        - type: object
          properties:
            eventType:
              const: CouponUpdated
      examples:
      - name: CouponUpdated예시
        payload:
          eventId: 74b623b8-90ee-4f65-919c-d9ad2ea46fc2
          eventType: CouponUpdated
          schemaVersion: 1
          source: commerce-service
          aggregateId: coupon-opaque-id
          occurredAt: '2026-10-14T09:00:00Z'
          payload:
            couponId: coupon-opaque-id
            snapshotVersion: 2
            name: 상품 할인 쿠폰
            fixedDiscount: 1000
            productIds: *id001
            startsAt: '2026-10-15T09:00:00Z'
            endsAt: '2026-10-16T09:00:00Z'
            expiresAt: '2026-10-17T09:00:00Z'
            soldOut: false
    CouponSoldOut:
      name: CouponSoldOut
      title: 쿠폰 발급 수량 소진
      traits:
      - $ref: '#/components/messageTraits/couponInfo'
      payload:
        allOf:
        - $ref: '#/components/schemas/CouponInfoEnvelope'
        - type: object
          properties:
            eventType:
              const: CouponSoldOut
      examples:
      - name: CouponSoldOut예시
        payload:
          eventId: 74b623b8-90ee-4f65-919c-d9ad2ea46fc3
          eventType: CouponSoldOut
          schemaVersion: 1
          source: commerce-service
          aggregateId: coupon-opaque-id
          occurredAt: '2026-10-14T09:00:00Z'
          payload:
            couponId: coupon-opaque-id
            snapshotVersion: 3
            name: 상품 할인 쿠폰
            fixedDiscount: 1000
            productIds: *id001
            startsAt: '2026-10-15T09:00:00Z'
            endsAt: '2026-10-16T09:00:00Z'
            expiresAt: '2026-10-17T09:00:00Z'
            soldOut: true
  schemas:
    CouponInfoEnvelope:
      type: object
      required:
      - eventId
      - eventType
      - schemaVersion
      - source
      - aggregateId
      - occurredAt
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - CouponCreated
          - CouponUpdated
          - CouponSoldOut
        schemaVersion:
          const: 1
        source:
          const: commerce-service
        aggregateId: *id002
        occurredAt:
          type: string
          format: date-time
        payload:
          $ref: '#/components/schemas/CouponDisplaySnapshot'
    CouponDisplaySnapshot:
      type: object
      required:
      - couponId
      - snapshotVersion
      - name
      - fixedDiscount
      - productIds
      - startsAt
      - endsAt
      - expiresAt
      - soldOut
      properties:
        couponId: *id002
        snapshotVersion:
          type: integer
          format: int64
          minimum: 1
          description: 표시 스냅샷의 쿠폰별 버전. 판매자 설정 version과 독립적이다.
        name:
          type: string
          minLength: 1
          maxLength: 100
        fixedDiscount:
          type: integer
          format: int64
          minimum: 1
        productIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
          description: 정렬된 전체 대상 상품 목록. 이전 목록을 교체한다. 빈 목록은 기존 연결을 전부 제거한다.
        startsAt:
          type: string
          format: date-time
          description: 발급 시작 시각, 포함 경계.
        endsAt:
          type: string
          format: date-time
          description: 발급 종료 시각, 제외 경계. 별도 시간 경계 이벤트는 발행하지 않는다.
        expiresAt:
          type: string
          format: date-time
          description: 발급된 회원 쿠폰의 사용 만료 시각.
        soldOut:
          type: boolean
          description: 발급 수량 소진 여부. 사용·환불로 발급 수량을 되돌리지 않는다.
      description: 상품 표시용 전체 쿠폰 스냅샷. 회원 발급/사용 상태와 발급 잔여 수량은 포함하지 않는다. 실제 발급·사용 판정은
        Commerce가 수행한다.
