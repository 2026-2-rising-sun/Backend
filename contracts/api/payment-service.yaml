openapi: 3.1.0
info:
  title: Payment Service 내부 API
  version: 1.0.0
  license:
    name: UNLICENSED
  description: >-
    브라우저 공개 경로가 없는 독립 결제 실행 서비스. 기존 Mock 결제·환불 API는 #347에서 지웠고 지금 열린 경로는 없다(모든
    /v1/internal 하위 요청은 서비스 토큰 검사 뒤 403). 새 결제 API는 #348에서 다시 정의한다.
servers:
- url: http://localhost:8086
security:
- ServiceToken: []
paths: {}
components:
  securitySchemes:
    ServiceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: COMMERCECORE_PAYMENT_SERVICE_TOKEN으로 인증된 commercecore 호출자만 허용한다.
