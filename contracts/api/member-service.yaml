openapi: 3.1.0
info:
  title: Member Service API
  version: 0.1.0
  license: { name: UNLICENSED }
  description: |
    현재 구현된 회원가입·본인 프로필 계약이다. 성공과 오류 모두 ApiResponse 봉투를 사용한다.
    로그인·refresh·logout·탈퇴·소셜은 정책 및 구현 인계 전이며 이 파일의 완료 범위에 포함하지 않는다.
    가입 성공은 access/refresh token 발급이 아니다. 토큰 TTL·폐기 정책도 이 파일에서 확정하지 않는다.
security: [{ BearerAuth: [] }]
servers:
  - url: http://localhost:8081
    description: Member Service API 로컬 직접 호출
  - url: http://dev-member-service:8080
    description: dev 네임스페이스 내부 Service 주소
tags:
  - name: Member
    description: 회원가입 및 본인 프로필
paths:
  /v1/auth/signup:
    post:
      tags: ["Member"]
      summary: "이메일 회원가입"
      operationId: "signupMember"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/SignupRequest"}
            example: {"email": "member@example.com", "password": "test-password-123", "displayName": "회원"}
      responses:
        "201":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/MemberEnvelope"}
              examples:
                created: {"value": {"success": true, "data": {"memberId": "11111111-1111-4111-8111-111111111111", "email": "member@example.com", "displayName": "회원", "roles": ["USER"]}, "error": null}}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "500": {"$ref": "#/components/responses/InternalError"}
  /v1/members/me:
    get:
      tags: ["Member"]
      summary: "본인 회원정보 조회"
      operationId: "getMyProfile"
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/MemberEnvelope"}
              examples:
                normal: {"value": {"success": true, "data": {"memberId": "11111111-1111-4111-8111-111111111111", "email": "member@example.com", "displayName": "회원", "roles": ["USER"]}, "error": null}}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "500": {"$ref": "#/components/responses/InternalError"}
    patch:
      tags: ["Member"]
      summary: "본인 표시 이름 수정"
      operationId: "updateMyProfile"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/ProfileUpdateRequest"}
            example: {"displayName": "새 이름"}
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/MemberEnvelope"}
              examples:
                updated: {"value": {"success": true, "data": {"memberId": "11111111-1111-4111-8111-111111111111", "email": "member@example.com", "displayName": "새 이름", "roles": ["USER"]}, "error": null}}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "500": {"$ref": "#/components/responses/InternalError"}
components:
  securitySchemes:
    BearerAuth: {"type": "http", "scheme": "bearer", "bearerFormat": "JWT", "description": "Member RS256 JWT. sub=UUID, iss=shoppinglive-member, aud=shoppinglive-api; USER/ADMIN. 쿠키·임의 회원/역할 헤더는 인증 수단이 아니다."}
  responses:
    BadRequest:
      description: "요청 값·형식 또는 금액 범위 오류"
      content:
        application/json:
          schema: {"$ref": "#/components/schemas/ErrorEnvelope"}
          examples:
            invalidRequest: {"value": {"success": false, "data": null, "error": {"code": "INVALID_REQUEST", "message": "잘못된 요청입니다.", "requestId": "request-001"}}}
    Unauthorized:
      description: "인증 누락·위조·만료 토큰. 사용자 JWT와 서비스 토큰은 대체되지 않는다."
      content:
        application/json:
          schema: {"$ref": "#/components/schemas/ErrorEnvelope"}
          examples:
            unauthorized: {"value": {"success": false, "data": null, "error": {"code": "UNAUTHORIZED", "message": "인증이 필요합니다.", "requestId": "request-001"}}}
    NotFound:
      description: "JWT의 회원 레코드가 없음"
      content:
        application/json:
          schema: {"$ref": "#/components/schemas/ErrorEnvelope"}
          examples:
            notFound: {"value": {"success": false, "data": null, "error": {"code": "NOT_FOUND", "message": "대상을 찾을 수 없습니다.", "requestId": "request-001"}}}
    Conflict:
      description: 정규화한 이메일 중복 (동시 가입 DB unique 충돌 포함)
      content:
        application/json:
          schema: { "$ref": "#/components/schemas/ErrorEnvelope" }
          examples:
            duplicateEmail: { value: { success: false, data: null, error: { code: CONFLICT, message: 이미 사용 중인 이메일입니다., requestId: request-001 } } }
    InternalError:
      description: "서버 내부 오류"
      content:
        application/json:
          schema: {"$ref": "#/components/schemas/ErrorEnvelope"}
          examples:
            internalError: {"value": {"success": false, "data": null, "error": {"code": "INTERNAL_ERROR", "message": "서버 내부 오류가 발생했습니다.", "requestId": "request-001"}}}
  schemas:
    SignupRequest:
      type: "object"
      additionalProperties: false
      required: ["email", "password", "displayName"]
      properties:
        email: {"type": "string", "format": "email", "maxLength": 254}
        password: {"type": "string", "format": "password", "minLength": 8, "maxLength": 72, "writeOnly": true, "description": "UTF-8 72바이트 이하도 검사. 로그·응답에 반환하지 않는다."}
        displayName: {"type": "string", "minLength": 1, "maxLength": 80}
      description: "email/displayName 앞뒤 공백 제거, email 소문자 정규화. 역할 입력으로 ADMIN을 부여할 수 없다."
    ProfileUpdateRequest:
      type: "object"
      additionalProperties: false
      required: ["displayName"]
      properties:
        displayName: {"type": "string", "minLength": 1, "maxLength": 80}
    MemberProfile:
      type: "object"
      required: ["memberId", "email", "displayName", "roles"]
      properties:
        memberId: {"type": "string", "format": "uuid"}
        email: {"type": "string", "format": "email"}
        displayName: {"type": "string"}
        roles: {"type": "array", "uniqueItems": true, "items": {"type": "string", "enum": ["USER", "ADMIN"]}}
    MemberEnvelope:
      type: "object"
      required: ["success", "data", "error"]
      properties:
        success: {"type": "boolean", "const": true}
        data: {"$ref": "#/components/schemas/MemberProfile"}
        error: {"type": "null"}
    ApiError:
      type: "object"
      required: ["code", "message", "requestId"]
      properties:
        code: {"type": "string"}
        message: {"type": "string"}
        requestId: {"type": ["string", "null"]}
    ErrorEnvelope:
      type: "object"
      required: ["success", "data", "error"]
      properties:
        success: {"type": "boolean", "const": false}
        data: {"type": "null"}
        error: {"$ref": "#/components/schemas/ApiError"}
