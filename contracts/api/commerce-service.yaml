      summary: "통합 결제 시작"
      operationId: "startMyGroupPayment"
      description: "양수 결제 금액은 Mock gateway 승인을 한 번 요청한다. 결제 금액이 0원이면 금전 승인을 요청하지 않고 주문·재고·쿠폰을 동기 확정하며 응답 시 결제 시도와 묶음 상태가 SUCCESS/PAID다. 같은 X-Idempotency-Key 재전송은 기존 결제 시도를 반환한다. 이미 시작된 결제에 다른 키를 보내면 409. 결제 전 만료시각을 검사하며 기한이 지난 묶음은 시작할 수 없다. 양수 승인 결과 불명/응답 유실은 확인 중으로 유지하고 조회·재확인으로 복구한다. Mock 승인 결과는 주문 반영 트랜잭션과 별도로 보관하여 승인 뒤 반영 실패에도 같은 시도를 재확인한다. 실제 외부 PG 승인을 보장하는 구현은 아니다."
      x-required-roles: ["USER","SELLER"]
      parameters: [{"$ref":"#/components/parameters/RequiredIdempotencyKey"}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {"$ref":"#/components/schemas/StartPaymentRequest"}
            example: {}
      responses:
        200:
          description: "0원 결제 즉시 완료 또는 완료된 동일 결제 시도 재전송"
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/PaymentAttempt"}
              example: {"paymentId":2,"orderId":2,"scenario":"INSTANT_SUCCESS","status":"SUCCESS","requestedAt":"2026-10-08T00:00:00Z","resolvedAt":"2026-10-08T00:00:00Z","scheduledResolveAt":"2026-10-08T00:00:00Z"}
        202:
          description: "양수 결제 승인 요청 접수 또는 진행 중인 동일 결제 시도 재전송"
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/PaymentAttempt"}
              example: {"paymentId":1,"orderId":1,"scenario":"INSTANT_SUCCESS","status":"PROCESSING","requestedAt":"2026-10-08T00:00:00Z","resolvedAt":null,"scheduledResolveAt":"2026-10-08T00:00:00Z"}
        400: {"$ref":"#/components/responses/BadRequest"}
        401: {"$ref":"#/components/responses/Unauthorized"}
        403: {"$ref":"#/components/responses/Forbidden"}
        404: {"$ref":"#/components/responses/NotFound"}
        409: {"$ref":"#/components/responses/Conflict"}
        503: {"$ref":"#/components/responses/AuthUnavailable"}
  /v1/payment-groups/{number}/payments/{id}:
    parameters: [{"$ref":"#/components/parameters/GroupNumber"},{"$ref":"#/components/parameters/GroupPaymentId"}]
    get:
      tags: ["Payment Groups"]
      summary: "통합 결제 시도 결과 조회"
      operationId: "getMyGroupPayment"
      description: "본인 묶음에 연결된 결제 시도만 조회한다. 타인 묶음·다른 묶음의 시도·없는 시도는 동일 404."
      x-required-roles: ["USER","SELLER"]
      responses:
        200:
          description: "성공"
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/PaymentAttempt"}
              example: {"paymentId":1,"orderId":1,"scenario":"INSTANT_SUCCESS","status":"PROCESSING","requestedAt":"2026-10-08T00:00:00Z","resolvedAt":null,"scheduledResolveAt":"2026-10-08T00:00:00Z"}
        400: {"$ref":"#/components/responses/BadRequest"}
        401: {"$ref":"#/components/responses/Unauthorized"}
        403: {"$ref":"#/components/responses/Forbidden"}
        404: {"$ref":"#/components/responses/NotFound"}
        503: {"$ref":"#/components/responses/AuthUnavailable"}
  /v1/payment-groups/{number}/cancel:
    parameters: [{"$ref":"#/components/parameters/GroupNumber"}]
    post:
      tags: ["Payment Groups"]
      summary: "결제 전 전체 주문 취소"
      operationId: "cancelMyPaymentGroup"
      description: "PENDING_PAYMENT 묶음의 상품별 주문 전체를 취소하고 예약 재고를 한 트랜잭션에서 반환한다. CANCELLED 재전송은 204. 결제 확인 중·완료·실패·만료는 409. 부분 취소/환불은 지원하지 않는다. 카트는 삭제하지 않는다."
      x-required-roles: ["USER","SELLER"]
      responses:
        204: {"description":"전체 취소 및 예약 재고 복구, 본문 없음"}
        401: {"$ref":"#/components/responses/Unauthorized"}
        403: {"$ref":"#/components/responses/Forbidden"}
        404: {"$ref":"#/components/responses/NotFound"}
        409: {"$ref":"#/components/responses/Conflict"}
        503: {"$ref":"#/components/responses/AuthUnavailable"}
  /v1/payment-groups/{number}/refunds:
    parameters: [{"$ref":"#/components/parameters/GroupNumber"}]
    post:
      tags: [Payment Groups]
      operationId: requestMyRefund
      summary: 본인 결제 묶음 전체 또는 장바구니 항목 전체 수량 환불 접수
      description: |-
        안전한 환불 실행·재처리 경로가 준비될 때까지 commerce.refunds.api-enabled 기본값 false로 경로가 비활성화된다.
        활성화 후 회원 본인 결제 묶음만 접수한다. 본문 생략은 결제 묶음 전체 환불, 본문을 보내면 비어 있지 않은 cartItemIds 배열이 필요하다. 값 지정은 해당 장바구니 항목 ID로 생성된 주문의 전체 수량을 뜻하며 빈 배열/null/빈 객체/알 수 없는 필드는 400으로 거절한다. 금액은 서버에 저장된 주문별 실부담액으로 계산하며 요청 금액/주문번호/부분 수량은 받지 않는다.
        결제 완료 후 168시간 경계 직전까지 서버 접수해야 한다. 장바구니 행은 결제 뒤 삭제되므로 주문 source_cart_item_id를 검증한다.
      x-required-roles: [USER, SELLER]
      parameters: [{"$ref":"#/components/parameters/RequiredRefundIdempotencyKey"}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {"$ref":"#/components/schemas/RefundRequest"}
            example: {cartItemIds: [101]}
      responses:
        201:
          description: 환불 접수 및 대상·실부담액 스냅샷 저장
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/RefundViewEnvelope"}
              example: {success: true, data: {id: 51, paymentGroupNumber: PG-EXAMPLE, refundAmount: 1900, cumulativeRefundAmount: 0, status: PROCESSING, requestedAt: '2026-10-09T00:00:00Z', resolvedAt: null, targets: [{cartItemId: 101, orderId: 301, productId: 1, productName: A, quantity: 2, refundAmount: 1900}]}, error: null}
        200:
          description: 동일 멱등 키·동일 입력 재요청, 기존 요청 반환
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/RefundViewEnvelope"}
        400: {"$ref":"#/components/responses/BadRequest"}
        401: {"$ref":"#/components/responses/Unauthorized"}
        403: {"$ref":"#/components/responses/Forbidden"}
        404: {"$ref":"#/components/responses/NotFound"}
        409: {"$ref":"#/components/responses/Conflict"}
        503: {"$ref":"#/components/responses/AuthUnavailable"}
    get:
      tags: [Payment Groups]
      operationId: listMyRefunds
      summary: 본인 결제 묶음 환불 이력
      x-required-roles: [USER, SELLER]
      responses:
        200:
          description: 회원 본인 결제 묶음의 환불 요청 목록
          content:
            application/json:
              schema: {type: object, required: [success, data, error], properties: {success: {const: true}, data: {type: array, items: {$ref: '#/components/schemas/RefundView'}}, error: {type: 'null'}}}
        401: {"$ref":"#/components/responses/Unauthorized"}
        404: {"$ref":"#/components/responses/NotFound"}
        503: {"$ref":"#/components/responses/AuthUnavailable"}
  /v1/payment-groups/{number}/refunds/{id}:
    parameters: [{"$ref":"#/components/parameters/GroupNumber"},{"$ref":"#/components/parameters/RefundId"}]
    get:
      tags: [Payment Groups]
      operationId: getMyRefund
      summary: 본인 환불 요청 상세
      x-required-roles: [USER, SELLER]
      responses:
        200: {description: 환불 요청과 전체 대상 상세, content: {application/json: {schema: {$ref: '#/components/schemas/RefundViewEnvelope'}}}}
        401: {"$ref":"#/components/responses/Unauthorized"}
        404: {"$ref":"#/components/responses/NotFound"}
        503: {"$ref":"#/components/responses/AuthUnavailable"}
  /v1/seller/refunds:
    get:
      tags: [Sales Admin]
      operationId: listMySellerRefunds
      summary: 본인 대상 주문의 환불 상태 목록
      description: 혼합 판매자 요청에서 본인 대상 주문·실부담액만 반환한다. 결제 묶음 총액·다른 판매자 주문과 대상은 반환하지 않는다.
      x-required-roles: [SELLER]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        200: {description: 판매자 본인 대상 환불만 조회, content: {application/json: {schema: {type: object, required: [success, data, error], properties: {success: {const: true}, data: {type: array, items: {$ref: '#/components/schemas/SellerRefundView'}}, error: {type: 'null'}}}}}}
        400: {"$ref":"#/components/responses/BadRequest"}
        401: {"$ref":"#/components/responses/Unauthorized"}
        403: {"$ref":"#/components/responses/Forbidden"}
        503: {"$ref":"#/components/responses/AuthUnavailable"}
  /v1/seller/refunds/{id}:
    parameters: [{"$ref":"#/components/parameters/RefundId"}]
    get:
      tags: [Sales Admin]
      operationId: getMySellerRefund
      summary: 본인 대상 주문의 환불 상세
      description: 요청의 판매자별 대상 금액과 주문만 반환하며 타 판매자 정보와 결제 묶음 총액은 숨긴다.
      x-required-roles: [SELLER]
      responses:
        200: {description: 판매자 본인 환불 대상만 조회, content: {application/json: {schema: {$ref: '#/components/schemas/SellerRefundViewEnvelope'}}}}
        401: {"$ref":"#/components/responses/Unauthorized"}
        403: {"$ref":"#/components/responses/Forbidden"}
        404: {"$ref":"#/components/responses/NotFound"}
        503: {"$ref":"#/components/responses/AuthUnavailable"}
  /v1/sales:
    get:
      tags: ["Internal Sales"]
      summary: "서비스용 판매정보 배치 조회"
      operationId: "getSalesForServices"
      description: "Shopping/Live 전용. 미등록 상품은 결과에서 제외하며 순서 미보장. 파라미터 누락은 400, 빈 값은 빈 배열. 반복 또는 단일 쉼표 목록을 지원하며 중복 제거 후 100개 제한. 반복과 쉼표를 섞은 형식은 보장하지 않는다."
      security: [{"ServiceToken": []}]
      parameters: [{"name": "productIds", "in": "query", "required": true, "schema": {"type": "array", "items": {"type": "integer", "format": "int64"}}, "style": "form", "explode": true, "description": "정규 형식 productIds=1&productIds=2. 단일 productIds=1,2도 지원. uniqueItems/maxItems는 중복 제거 전 요청 배열에 적용하지 않는다."}]
      x-allowed-callers: ["shopping", "live"]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: {"type": "array", "items": {"$ref": "#/components/schemas/SalesLookup"}}
              examples:
                normal: {"value": [{"productId": 1, "salesId": 1, "price": 15000, "status": "ON_SALE", "available": 10}]}
                empty: {"value": []}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
    post:
      tags: ["Sales Admin"]
      summary: "판매·초기 재고 등록"
      operationId: "registerSales"
      description: "Shopping 상품 존재 확인 후 READY로 등록한다."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/RegisterSalesRequest"}
            example: {"productId": 1, "price": 15000, "initialStock": 10}
      x-required-roles: ["SELLER"]
      responses:
        "201":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Sales"}
              examples:
                created: {"value": {"id": 1, "productId": 1, "price": 15000, "status": "READY", "version": 0}}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "503": {"$ref": "#/components/responses/ShoppingUnavailable"}
  /v1/sales/{id}/price:
    parameters: [{"$ref": "#/components/parameters/SalesId"}]
    patch:
      tags: ["Sales Admin"]
      summary: "판매가 변경"
      operationId: "changeSalesPrice"
      description: "클라이언트 version을 받지 않는다. 서버 트랜잭션 간 낙관적 충돌은 409."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/ChangePriceRequest"}
            example: {"price": 16000}
      x-required-roles: ["SELLER"]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Sales"}
              examples:
                updated: {"value": {"id": 1, "productId": 1, "price": 16000, "status": "READY", "version": 1}}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /v1/sales/{id}/stock:
    parameters: [{"$ref": "#/components/parameters/SalesId"}]
    get:
      tags: ["Sales Admin"]
      summary: "판매 재고 조회"
      operationId: "getSalesStock"
      x-required-roles: ["SELLER"]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/SalesStock"}
              examples:
                normal: {"value": {"salesInfoId": 1, "available": 10, "reserved": 0}}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "503":
          $ref: "#/components/responses/AuthUnavailable"
    patch:
      tags: ["Sales Admin"]
      summary: "판매 가능 재고 증감"
      operationId: "adjustSalesStock"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/AdjustStockRequest"}
            example: {"delta": 5}
      x-required-roles: ["SELLER"]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/SalesStock"}
              examples:
                updated: {"value": {"salesInfoId": 1, "available": 15, "reserved": 0}}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /v1/sales/{id}/status:
    parameters: [{"$ref": "#/components/parameters/SalesId"}]
    patch:
      tags: ["Sales Admin"]
      summary: "판매 상태 변경"
      operationId: "changeSalesStatus"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/ChangeStatusRequest"}
            example: {"status": "ON_SALE"}
      x-required-roles: ["SELLER"]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Sales"}
              examples:
                updated: {"value": {"id": 1, "productId": 1, "price": 15000, "status": "ON_SALE", "version": 1}}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /v1/dev/payment-scenarios/{orderNumber}:
    parameters: [{"$ref": "#/components/parameters/OrderNumber"}]
    put:
      tags: ["Local Test"]
      summary: "본인 주문 Mock 결과 지정"
      operationId: "setLocalPaymentScenario"
      description: "local 또는 test 프로필 AND dev/prod 비활성 AND commerce.dev.payment-scenario.enabled=true에서만 제공. SELLER도 본인 주문만 허용. 외부 dev/prod는 금지."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/SetPaymentScenarioRequest"}
            example: {"scenario": "DELAYED_SUCCESS"}
      x-required-roles: ["SELLER"]
      x-availability: "opt-in local/test only"
      responses:
        "204": {"description": "지정, 본문 없음"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "503":
          $ref: "#/components/responses/AuthUnavailable"
    delete:
      tags: ["Local Test"]
      summary: "본인 주문 Mock 결과 지정 제거"
      operationId: "clearLocalPaymentScenario"
      description: "PUT과 동일한 opt-in 프로필 및 본인 SELLER 조건."
      x-required-roles: ["SELLER"]
      x-availability: "opt-in local/test only"
      responses:
        "204": {"description": "지정 제거, 본문 없음"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "503":
          $ref: "#/components/responses/AuthUnavailable"
components:
  securitySchemes:
    BearerAuth: {"type": "http", "scheme": "bearer", "bearerFormat": "JWT", "description": "Member RS256 JWT. sub와 sid는 canonical UUID, iss=shoppinglive-member, aud=shoppinglive-api, exp/iat/jti 필수; USER/SELLER. 로컬 서명 검증 후 Member 권위 저장소의 세션 상태를 무캐시 확인한다. 확인 실패 503, 보안 폐기·탈퇴 401. 쿠키·임의 회원/역할 헤더는 인증 수단이 아니다."}
    ServiceToken: {"type": "apiKey", "in": "header", "name": "X-Service-Token", "description": "대상 서비스가 설정한 opaque token으로 호출 서비스 신원을 판정한다. 사용자 JWT와 분리한다."}
  parameters:
    GroupNumber:
      name: "number"
      in: "path"
      required: true
      schema: {"type":"string"}
      description: "본인 결제 묶음 번호"
    GroupPaymentId:
      name: "id"
      in: "path"
      required: true
      schema: {"type":"integer","format":"int64","minimum":1}
    RefundId: {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    OrderNumber: {"name": "orderNumber", "in": "path", "required": true, "schema": {"type": "string"}}
    PaymentId: {"name": "paymentId", "in": "path", "required": true, "schema": {"type": "integer", "format": "int64", "minimum": 1}}
    ItemId: {"name": "itemId", "in": "path", "required": true, "schema": {"type": "integer", "format": "int64", "minimum": 1}}
    SalesId: {"name": "id", "in": "path", "required": true, "schema": {"type": "integer", "format": "int64", "minimum": 1}}
    OptionalIdempotencyKey: {"name": "X-Idempotency-Key", "in": "header", "required": false, "schema": {"type": "string", "minLength": 1, "maxLength": 64}, "description": "회원별 멱등키. 공백만 허용하지 않으며 동일 키의 입력 변경은 409."}
    RequiredIdempotencyKey: {"name": "X-Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 64}, "description": "회원별 요청 식별자. 동일 키·입력 재전송은 카트 변경·삭제 뒤에도 기존 결과로 연결한다. 다른 입력은 409이며 재전송 HTTP 상태는 각 API의 응답 정의를 따른다."}
    RequiredRefundIdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}, description: 환불 요청 멱등 키. 회원별 같은 입력은 기존 요청을 반환하며 다른 결제 묶음/장바구니 ID 입력은 409.}
  responses:
    BadRequest:
      description: "요청 값·형식 또는 금액 범위 오류"
      content:
        application/json:
          schema: {"$ref": "#/components/schemas/ErrorEnvelope"}
          examples:
            invalidRequest: {"value": {"success": false, "data": null, "error": {"code": "INVALID_REQUEST", "message": "잘못된 요청입니다.", "requestId": "request-001"}}}
    Unauthorized:
      description: "인증 누락·위조·만료 토큰. 사용자 JWT와 서비스 토큰은 대체되지 않는다."
      content:
        application/json:
          schema: {"$ref": "#/components/schemas/ErrorEnvelope"}
          examples:
            unauthorized: {"value": {"success": false, "data": null, "error": {"code": "UNAUTHORIZED", "message": "인증이 필요합니다.", "requestId": "request-001"}}}
    Forbidden:
      description: "검증된 주체의 권한 부족 또는 비활성 개발 API"
      content:
        application/json:
          schema: {"$ref": "#/components/schemas/ErrorEnvelope"}
          examples:
            forbidden: {"value": {"success": false, "data": null, "error": {"code": "FORBIDDEN", "message": "권한이 없습니다.", "requestId": "request-001"}}}
    NotFound:
      description: "대상이 없거나 다른 회원 소유. SELLER도 동일한 본인 조건 적용."
      content:
        application/json:
          schema: {"$ref": "#/components/schemas/ErrorEnvelope"}
          examples:
            notFound: {"value": {"success": false, "data": null, "error": {"code": "NOT_FOUND", "message": "대상을 찾을 수 없습니다.", "requestId": "request-001"}}}
    Conflict:
      description: "중복·상태·동시 수정·멱등키 입력 충돌"
      content:
        application/json:
          schema: {"$ref": "#/components/schemas/ErrorEnvelope"}
          examples:
            conflict: {"value": {"success": false, "data": null, "error": {"code": "CONFLICT", "message": "요청이 현재 상태와 충돌합니다.", "requestId": "request-001"}}}
            insufficientStock: {"value": {"success": false, "data": null, "error": {"code": "CONFLICT", "message": "재고가 부족합니다.", "requestId": "request-001"}}}
            amountChanged: {"value": {"success": false, "data": null, "error": {"code": "CONFLICT", "message": "주문 금액이 변경되었습니다.", "requestId": "request-001"}}}
            duplicateCartItem: {"value": {"success": false, "data": null, "error": {"code": "CONFLICT", "message": "이미 장바구니에 있는 상품입니다. 수량을 변경해 주세요.", "requestId": "request-001"}}}
    ShoppingUnavailable:
      description: "Shopping HTTP 오류·타임아웃·응답 계약 위반은 SHOPPING_UNAVAILABLE. Member 세션 인증 상태 확인 장애는 SERVICE_UNAVAILABLE. 확인된 상품 미존재 404와 구분한다."
      content:
        application/json:
          schema: {"$ref": "#/components/schemas/ErrorEnvelope"}
          examples:
            shoppingUnavailable: {"value": {"success": false, "data": null, "error": {"code": "SHOPPING_UNAVAILABLE", "message": "상품 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.", "requestId": "request-001"}}}
            authUnavailable: {"value": {"success": false, "data": null, "error": {"code": "SERVICE_UNAVAILABLE", "message": "인증 상태를 확인할 수 없습니다.", "requestId": "request-001"}}}
    InternalError:
      description: "서버 내부 오류"
      content:
        application/json:
          schema: {"$ref": "#/components/schemas/ErrorEnvelope"}
          examples:
            internalError: {"value": {"success": false, "data": null, "error": {"code": "INTERNAL_ERROR", "message": "서버 내부 오류가 발생했습니다.", "requestId": "request-001"}}}
    AuthUnavailable:
      description: JWT 세션 상태를 확인할 Member 또는 회원 저장소가 일시적으로 불가하여 요청을 허용하지 않음.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            authUnavailable:
              value:
                success: false
                data: null
                error:
                  code: SERVICE_UNAVAILABLE
                  message: 인증 상태를 확인할 수 없습니다.
                  requestId: request-001
  schemas:
    RefundStatus:
      type: string
      enum: [PROCESSING, UNKNOWN, SUCCESS, FAILED]
    RefundRequest:
      type: object
      additionalProperties: false
      required: [cartItemIds]
      properties:
        cartItemIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}, description: 하나 이상의 장바구니 항목 ID. ID별 연결 주문의 전체 수량을 환불한다. 전체 묶음 환불은 요청 본문을 생략한다.}
    RefundTarget:
      type: object
      required: [cartItemId, orderId, productId, productName, quantity, refundAmount]
      properties:
        cartItemId: {type: [integer, 'null'], format: int64, minimum: 1, description: 레거시 주문에 원본 cart item ID가 없으면 null}
        orderId: {type: integer, format: int64, minimum: 1}
        productId: {type: integer, format: int64, minimum: 1}
        productName: {type: string}
        quantity: {type: integer, minimum: 1}
        refundAmount: {type: integer, format: int64, minimum: 0}
    RefundView:
      type: object
      required: [id, paymentGroupNumber, refundAmount, cumulativeRefundAmount, status, requestedAt, resolvedAt, targets]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        paymentGroupNumber: {type: string}
        refundAmount: {type: integer, format: int64, minimum: 0}
        cumulativeRefundAmount: {type: integer, format: int64, minimum: 0, description: 결제 묶음에서 SUCCESS 확정된 환불 요청의 누적 금액}
        status: {$ref: '#/components/schemas/RefundStatus'}
        requestedAt: {type: string, format: date-time}
        resolvedAt: {type: [string, 'null'], format: date-time}
        targets: {type: array, items: {$ref: '#/components/schemas/RefundTarget'}}
    SellerRefundView:
      type: object
      required: [id, refundAmount, cumulativeRefundAmount, status, requestedAt, resolvedAt, targets]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        refundAmount: {type: integer, format: int64, minimum: 0, description: 해당 판매자 대상 주문만의 실부담액 합계}
        cumulativeRefundAmount: {type: integer, format: int64, minimum: 0, description: 해당 판매자 주문에서 SUCCESS 확정된 환불의 누적 금액}
        status: {$ref: '#/components/schemas/RefundStatus'}
        requestedAt: {type: string, format: date-time}
        resolvedAt: {type: [string, 'null'], format: date-time}
        targets: {type: array, items: {$ref: '#/components/schemas/RefundTarget'}}
    RefundViewEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/RefundView'}
        error: {type: 'null'}
    SellerRefundViewEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/SellerRefundView'}
        error: {type: 'null'}
    AvailableCoupon:
      type: object
      required: [id, name, fixedDiscount, remaining, endsAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        fixedDiscount: { type: integer, format: int64, minimum: 1 }
        remaining: { type: integer, minimum: 1 }
        endsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    MemberCoupon:
      type: object
      required: [id, couponId, name, fixedDiscount, status, claimedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        couponId: { type: string, format: uuid }
        name: { type: string }
        fixedDiscount: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [AVAILABLE, RESERVED, USED, EXPIRED] }
        claimedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    AvailableCouponsEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { const: true }
        data: { type: array, items: { $ref: '#/components/schemas/AvailableCoupon' } }
        error: { type: 'null' }
    MemberCouponEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/MemberCoupon' }
        error: { type: 'null' }
    MemberCouponsEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { const: true }
        data: { type: array, items: { $ref: '#/components/schemas/MemberCoupon' } }
        error: { type: 'null' }
    CreateCoupon:
      type: object
      required: [name, fixedDiscount, issuanceLimit, startsAt, endsAt, expiresAt, productIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        fixedDiscount: { type: integer, format: int64, minimum: 1, maximum: 9223372036854775807 }
        issuanceLimit: { type: integer, minimum: 1, maximum: 10000 }
        startsAt: { type: string, format: date-time, description: '0001~9999년 범위. 원본 기간 검증 후 마이크로초로 절삭·재검증하여 저장과 응답에 사용.' }
        endsAt: { type: string, format: date-time, description: '시작보다 늦고 원본·저장 시각 모두 최대 720시간. 정밀도 절삭 후 기간이 0이면 400.' }
        expiresAt: { type: string, format: date-time, description: '종료 이상, 9999년 이하. 마이크로초 정밀도로 저장·응답.' }
        productIds: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, format: int64, minimum: 1 } }
    Coupon:
      allOf:
        - { $ref: '#/components/schemas/CreateCoupon' }
        - type: object
          required: [id, sellerId, issuedCount, version]
          properties:
            id: { type: string, format: uuid }
            sellerId: { type: string, format: uuid }
            issuedCount: { type: integer, minimum: 0, maximum: 10000 }
            version: { type: integer, format: int64, minimum: 0 }
    CouponEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/Coupon' }
        error: { type: 'null' }
    CartSelection:
      type: "object"
      required: ["itemId","version"]
      properties:
        itemId: {"type":"integer","format":"int64","minimum":1}
        version: {"type":"integer","format":"int64","minimum":0}
    CartCheckoutRequest:
      type: "object"
      required: ["items"]
      properties:
        items: {"type":"array","minItems":1,"maxItems":100,"items":{"$ref":"#/components/schemas/CartSelection"}}
        couponId: {"type":["string","null"],"maxLength":64}
      description: "항목별 현재 버전이 필수이며 항목 ID 중복은 허용하지 않는다. 배열 순서는 멱등성 비교에 영향을 주지 않는다."
    CreateCartGroupRequest:
      type: "object"
      required: ["items","buyerName","buyerPhone","expectedTotalAmount"]
      properties:
        items: {"type":"array","minItems":1,"maxItems":100,"items":{"$ref":"#/components/schemas/CartSelection"}}
        buyerName: {"type":"string","minLength":1,"maxLength":64}
        buyerPhone: {"type":"string","pattern":"^[0-9-]{9,32}$","writeOnly":true}
        expectedTotalAmount: {"type":"integer","format":"int64","minimum":1}
        couponId: {"type":["string","null"],"maxLength":64}
    CartCheckoutItem:
      type: "object"
      required: ["itemId","version","productId","productName","quantity","unitPrice","totalAmount","discountAmount","payableAmount"]
      properties:
        itemId: {"type":"integer","format":"int64","minimum":1}
        version: {"type":"integer","format":"int64","minimum":0}
        productId: {"type":"integer","format":"int64","minimum":1}
        productName: {"type":"string"}
        quantity: {"type":"integer","format":"int32","minimum":1,"maximum":2147483647}
        unitPrice: {"type":"integer","format":"int64","minimum":1}
        totalAmount: {"type":"integer","format":"int64","minimum":1}
        discountAmount: {"type":"integer","format":"int64","minimum":0}
        payableAmount: {"type":"integer","format":"int64","minimum":0}
    CartCheckout:
      type: "object"
      required: ["items","totalAmount","discountAmount","payableAmount"]
      properties:
        items: {"type":"array","minItems":1,"maxItems":100,"items":{"$ref":"#/components/schemas/CartCheckoutItem"}}
        totalAmount: {"type":"integer","format":"int64","minimum":1}
        couponId: {"type":["string","null"],"maxLength":64}
        discountAmount: {"type":"integer","format":"int64","minimum":0}
        payableAmount: {"type":"integer","format":"int64","minimum":0}
    PaymentGroup:
      type: "object"
      required: ["groupNumber","status","totalAmount","discountAmount","payableAmount","couponId","expiresAt","orders","paymentId"]
      properties:
        groupNumber: {"type":"string"}
        status: {"type":"string","enum":["PENDING_PAYMENT","PAYMENT_CONFIRMING","PAID","FAILED","CANCELLED","EXPIRED","REFUNDED"]}
        totalAmount: {"type":"integer","format":"int64","minimum":1}
        discountAmount: {"type":"integer","format":"int64","minimum":0}
        payableAmount: {"type":"integer","format":"int64","minimum":0}
        couponId: {"type":["string","null"],"maxLength":64}
        expiresAt: {"type":"string","format":"date-time"}
        orders: {"type":"array","minItems":1,"maxItems":100,"items":{"$ref":"#/components/schemas/Order"}}
        paymentId: {"type":["integer","null"],"format":"int64","minimum":1}
      description: "totalAmount는 할인 전 주문 원금 합계, discountAmount는 할인 합계, payableAmount는 결제 실부담액이다. 결제 시작 전 paymentId는 null. payableAmount가 0인 묶음은 결제 시작 요청 안에서 금전 승인 없이 PAID로 확정된다. 환불로 일부 주문만 환불된 묶음은 PAID를 유지하고 모든 주문이 환불되면 REFUNDED다. 만료는 미결제에만 적용되며 확인 중에는 임의 취소·재고 반환을 하지 않는다."
    CreateOrderRequest:
      type: "object"
      required: ["productId", "quantity", "buyerName", "buyerPhone"]
      properties:
        productId: {"type": "integer", "format": "int64", "minimum": 1}
        quantity: {"type": "integer", "format": "int32", "minimum": 1, "maximum": 2147483647}
        buyerName: {"type": "string", "minLength": 1, "maxLength": 64}
        buyerPhone: {"type": "string", "pattern": "^[0-9-]{9,32}$", "writeOnly": true}
        expectedTotalAmount: {"type": ["integer", "null"], "format": "int64", "minimum": 1}
        couponId: {"type": ["string", "null"], "maxLength": 64}
      description: "소유자는 JWT sub이다. 비회원 조회 비밀번호는 지원하지 않는다. expectedTotalAmount는 직접 주문에서 선택이며 할인 전 금액을 보내면 최신 상품 합계와 일치해야 한다. couponId는 선택이며 같은 멱등키 재요청에서 쿠폰 ID가 달라지면 409다."
    CartOrderRequest:
      type: "object"
      required: ["buyerName", "buyerPhone", "expectedTotalAmount"]
      properties:
        buyerName: {"type": "string", "minLength": 1, "maxLength": 64}
        buyerPhone: {"type": "string", "pattern": "^[0-9-]{9,32}$", "writeOnly": true}
        expectedTotalAmount: {"type": "integer", "format": "int64", "minimum": 1}
      description: "선택 항목 하나를 단건 주문으로 전환한다. expectedTotalAmount 필수."
    AddCartItemRequest:
      type: "object"
      required: ["productId", "quantity"]
      properties:
        productId: {"type": "integer", "format": "int64", "minimum": 1}
        quantity: {"type": "integer", "format": "int32", "minimum": 1, "maximum": 2147483647}
    QuantityRequest:
      type: "object"
      required: ["quantity"]
      properties:
        quantity: {"type": "integer", "format": "int32", "minimum": 1, "maximum": 2147483647}
      description: "증감량이 아닌 최종 절대 수량."
    CartItem:
      type: "object"
      required: ["id", "productId", "quantity", "version"]
      properties:
        id: {"type": "integer", "format": "int64", "minimum": 1}
        productId: {"type": "integer", "format": "int64", "minimum": 1}
        quantity: {"type": "integer", "format": "int32", "minimum": 1, "maximum": 2147483647}
        version: {"type": "integer", "format": "int64", "minimum": 0}
    Order:
      type: "object"
      required: ["orderNumber", "productName", "quantity", "unitPrice", "totalAmount", "discountAmount", "payableAmount", "status", "buyerName", "createdAt", "expiresAt", "cancelledAt", "groupNumber"]
      properties:
        orderNumber: {"type": "string"}
        groupNumber: {"type": ["string", "null"], "description": "연결된 결제 묶음 번호. 기존 그룹 없는 주문은 null."}
        productName: {"type": "string"}
        quantity: {"type": "integer", "format": "int32", "minimum": 1, "maximum": 2147483647}
        unitPrice: {"type": "integer", "format": "int64", "minimum": 1}
        totalAmount: {"type": "integer", "format": "int64", "minimum": 1}
        discountAmount: {"type": "integer", "format": "int64", "minimum": 0}
        payableAmount: {"type": "integer", "format": "int64", "minimum": 0}
        status: {"type": "string", "enum": ["PENDING_PAYMENT", "PAYMENT_CONFIRMING", "PAID", "FAILED", "CANCELLED", "EXPIRED", "REFUNDED"]}
        buyerName: {"type": "string"}
        createdAt: {"type": "string", "format": "date-time"}
        expiresAt: {"type": ["string", "null"], "format": "date-time"}
        cancelledAt: {"type": ["string", "null"], "format": "date-time"}
    OrderHistory:
      type: "object"
      required: ["items", "page", "size", "totalElements", "totalPages"]
      properties:
        items: {"type": "array", "items": {"$ref": "#/components/schemas/Order"}}
        page: {"type": "integer", "format": "int64", "minimum": 0}
        size: {"type": "integer", "minimum": 1, "maximum": 100}
        totalElements: {"type": "integer", "format": "int64", "minimum": 0}
        totalPages: {"type": "integer", "format": "int64", "minimum": 0}
    OrderCheckout:
      type: "object"
      required: ["productId", "salesId", "productName", "unitPrice", "quantity", "totalAmount", "available", "salesStatus", "orderable", "reason", "discountAmount", "payableAmount"]
      properties:
        productId: {"type": "integer", "format": "int64", "minimum": 1}
        salesId: {"type": "integer", "format": "int64", "minimum": 1}
        productName: {"type": "string"}
        unitPrice: {"type": "integer", "format": "int64", "minimum": 1}
        quantity: {"type": "integer", "format": "int32", "minimum": 1, "maximum": 2147483647}
        totalAmount: {"type": "integer", "format": "int64", "minimum": 1}
        available: {"type": "integer", "format": "int64", "minimum": 0}
        salesStatus: {"$ref": "#/components/schemas/SalesStatus"}
        orderable: {"type": "boolean"}
        reason: {"type": ["string", "null"], "enum": ["NOT_ON_SALE", "SOLD_OUT", "EXCEEDS_STOCK", null]}
        couponId: {"type": ["string", "null"], "maxLength": 64}
        discountAmount: {"type": "integer", "format": "int64", "minimum": 0}
        payableAmount: {"type": "integer", "format": "int64", "minimum": 0}
    PaymentAttempt:
      type: "object"
      required: ["paymentId", "orderId", "scenario", "status", "requestedAt", "resolvedAt", "scheduledResolveAt"]
      properties:
        paymentId: {"type": "integer", "format": "int64", "minimum": 1}
        orderId: {"type": "integer", "format": "int64", "minimum": 1}
        scenario: {"$ref": "#/components/schemas/PaymentScenario", "readOnly": true}
        status: {"type": "string", "enum": ["PENDING", "PROCESSING", "SUCCESS", "FAILED", "TIMEOUT"]}
        requestedAt: {"type": "string", "format": "date-time"}
        resolvedAt: {"type": ["string", "null"], "format": "date-time"}
        scheduledResolveAt: {"type": ["string", "null"], "format": "date-time"}
      description: "현재 결제 게이트웨이는 Mock이다. scenario는 서버 결과이며 일반 결제 요청에서 선택할 수 없다."
    PaymentScenario:
      type: "string"
      enum: ["INSTANT_SUCCESS", "INSTANT_FAIL", "DELAYED_SUCCESS", "DELAYED_FAIL"]
    SetPaymentScenarioRequest:
      type: "object"
      required: ["scenario"]
      properties:
        scenario: {"$ref": "#/components/schemas/PaymentScenario"}
    StartPaymentRequest:
      type: [object, 'null']
      maxProperties: 0
      additionalProperties: false
      description: "본문 생략, JSON null 또는 빈 객체만 허용. scenario 등 필드가 하나라도 있으면 400."
    RegisterSalesRequest:
      type: "object"
      required: ["productId", "price", "initialStock"]
      properties:
        productId: {"type": "integer", "format": "int64"}
        price: {"type": "integer", "format": "int64", "minimum": 1}
        initialStock: {"type": "integer", "format": "int32", "minimum": 0, "maximum": 2147483647}
    ChangePriceRequest:
      type: "object"
      required: ["price"]
      properties:
        price: {"type": "integer", "format": "int64", "minimum": 1}
    AdjustStockRequest:
      type: "object"
      required: ["delta"]
      properties:
        delta: {"type": "integer", "format": "int32", "minimum": -2147483648, "maximum": 2147483647}
      description: "양수 추가·음수 감소·0 허용. 결과 available이 음수가 되면 409."
    ChangeStatusRequest:
      type: "object"
      required: ["status"]
      properties:
        status: {"type": "string", "enum": ["ON_SALE", "PRIVATE"]}
      description: "READY/SOLD_OUT은 판매자 입력 불가(400); 재고에 따른 SOLD_OUT은 시스템이 결정한다."
    SalesStatus:
      type: "string"
      enum: ["READY", "ON_SALE", "SOLD_OUT", "PRIVATE"]
    Sales:
      type: "object"
      required: ["id", "productId", "price", "status", "version"]
      properties:
        id: {"type": "integer", "format": "int64", "minimum": 1}
        productId: {"type": "integer", "format": "int64", "minimum": 1}
        price: {"type": "integer", "format": "int64", "minimum": 1}
        status: {"$ref": "#/components/schemas/SalesStatus"}
        version: {"type": "integer", "format": "int64", "minimum": 0}
    SalesStock:
      type: "object"
      required: ["salesInfoId", "available", "reserved"]
      properties:
        salesInfoId: {"type": "integer", "format": "int64", "minimum": 1}
        available: {"type": "integer", "format": "int64", "minimum": 0}
        reserved: {"type": "integer", "format": "int64", "minimum": 0}
    SalesLookup:
      type: "object"
      required: ["productId", "salesId", "price", "status", "available"]
      properties:
        productId: {"type": "integer", "format": "int64", "minimum": 1}
        salesId: {"type": "integer", "format": "int64", "minimum": 1}
        price: {"type": "integer", "format": "int64", "minimum": 1}
        status: {"$ref": "#/components/schemas/SalesStatus"}
        available: {"type": "integer", "format": "int64", "minimum": 0}
    ApiError:
      type: "object"
      required: ["code", "message", "requestId"]
      properties:
        code: {"type": "string"}
        message: {"type": "string"}
        requestId: {"type": ["string", "null"]}
    ErrorEnvelope:
      type: "object"
      required: ["success", "data", "error"]
      properties:
        success: {"type": "boolean", "const": false}
        data: {"type": "null"}
        error: {"$ref": "#/components/schemas/ApiError"}
