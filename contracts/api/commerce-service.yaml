      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref":"#/components/schemas/CartCheckoutRequest"}
            example: {"items":[{"itemId":1,"version":0},{"itemId":2,"version":0}],"couponId":"33333333-3333-4333-8333-333333333334"}
      responses:
        200:
          description: "성공"
          content:
