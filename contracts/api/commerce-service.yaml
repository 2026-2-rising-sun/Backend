  /v1/cart/items/{itemId}/orders:
    parameters: [{"$ref": "#/components/parameters/ItemId"}]
    post:
      tags: ["Cart"]
      summary: "장바구니 한 항목 주문"
      operationId: "orderMyCartItem"
      description: "기존 한 항목 주문 경로를 유지하며 주문 하나를 가진 결제 묶음으로 생성한다. 회원당 활성 묶음 하나 제한은 단건에도 적용한다. 선택 항목의 상품·수량 변경과 현재 가격·판매·재고를 재검증하며 주문 저장·예약은 원자적이다. 생성 시 카트를 유지하고 결제 성공 때 원본 ID·버전이 같은 항목만 삭제한다. 대기 중 수량 변경·삭제는 허용하며 주문 스냅샷은 바뀌지 않는다. 동일 키·입력 재전송은 카트 삭제 뒤에도 원래 주문을 반환한다. 여러 항목은 POST /v1/cart/orders를 사용한다."
      parameters: [{"$ref": "#/components/parameters/RequiredIdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/CartOrderRequest"}
            example: {"buyerName": "구매자", "buyerPhone": "010-1234-5678", "expectedTotalAmount": 30000}
      x-required-roles: ["USER", "SELLER"]
      responses:
        "201":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Order"}
              examples:
                created: {"value": {"orderNumber": "20261001-000001", "productName": "가을 니트", "quantity": 2, "unitPrice": 15000, "totalAmount": 30000, "discountAmount": 0, "payableAmount": 30000, "status": "PENDING_PAYMENT", "buyerName": "구매자", "createdAt": "2026-10-01T00:00:00Z", "expiresAt": "2026-10-01T00:15:00Z", "cancelledAt": null, "groupNumber": "PG-00000000-0000-0000-0000-000000000149"}}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "503": {"$ref": "#/components/responses/ShoppingUnavailable"}
        "200":
          description: "동일 회원·멱등키·입력 재전송"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Order"}
              examples:
                replay: {"value": {"orderNumber": "20261001-000001", "productName": "가을 니트", "quantity": 2, "unitPrice": 15000, "totalAmount": 30000, "discountAmount": 0, "payableAmount": 30000, "status": "PENDING_PAYMENT", "buyerName": "구매자", "createdAt": "2026-10-01T00:00:00Z", "expiresAt": "2026-10-01T00:15:00Z", "cancelledAt": null, "groupNumber": "PG-00000000-0000-0000-0000-000000000149"}}
  /v1/cart/checkout:
    post:
      tags: ["Cart"]
      summary: "선택 상품 통합 주문서 확인"
      operationId: "previewMyCartGroup"
      description: "1~100개 항목의 소유권·버전·판매 상태·재고와 최신 가격을 확인한다. couponId가 있으면 회원 보유·사용 가능 기간과 대상 상품을 서버에서 확인하고 대상 주문에만 정액 할인을 비례 배분한다. 중복 ID는 400, 변경된 버전·판매 불가·재고 부족·사용할 수 없는 쿠폰은 409. 조회 단계는 쿠폰·재고를 예약하거나 주문을 만들지 않는다."
