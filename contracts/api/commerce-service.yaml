              schema: {"$ref":"#/components/schemas/CartCheckout"}
              example: {"items":[{"itemId":1,"version":0,"productId":1,"productName":"상품 1","quantity":2,"unitPrice":10000,"totalAmount":20000,"discountAmount":2000,"payableAmount":18000},{"itemId":2,"version":0,"productId":2,"productName":"상품 2","quantity":1,"unitPrice":5000,"totalAmount":5000,"discountAmount":0,"payableAmount":5000}],"totalAmount":25000,"couponId":"33333333-3333-4333-8333-333333333334","discountAmount":2000,"payableAmount":23000}
