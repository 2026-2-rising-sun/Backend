openapi: 3.1.0
info:
  title: Commerce Service API
  version: 2.0.0
  license: { name: UNLICENSED }
  description: |-
    회원 전용 주문·결제·장바구니와 판매자 판매·재고 API. 모든 거래 소유자는 검증된 JWT sub에서 얻는다.
    USER와 SELLER의 타인 주문·결제·장바구니 접근은 404. 비회원 주문번호+비밀번호 구매/조회는 제거되었다.
    기존 거래 정상 응답은 봉투 없는 DTO/배열이다. 쿠폰 API는 성공·오류 모두 ApiResponse 봉투이다. 204는 본문 없음.
    현재 결제 외부 연동은 Mock이며 성공 예시는 실제 PG 승인 증거가 아니다. Gateway 없이 서비스가 JWT를 직접 검증한다.

    단건 구매를 포함해 회원당 활성 주문 묶음/결제는 하나이다. 결제 전 15분 만료, 확인 중 결과 불명은 재확인한다.
    장바구니는 주문 생성 뒤에도 편집할 수 있으며 결제 성공 때 원본 ID·version 일치 항목만 삭제한다.

    V4는 기존 단건 주문을 결제 묶음으로 연결한다. 회원별 활성 주문이 여러 건이면 자동 취소·삭제 없이 마이그레이션을 중단하므로 먼저 기존 거래를 명시적으로 정리해야 한다.

    JWT가 있으면 로컬 서명 검증 후 Member 세션을 매번 확인한다. 상태 확인 실패는 SERVICE_UNAVAILABLE 503이며 캐시로 우회하지 않는다. 공개 무토큰 및 서비스 caller 전용 요청은 Member 상태 확인과 독립이다.
security: [{ BearerAuth: [] }]
servers:
  - url: http://localhost:8083
    description: Commerce Service API 로컬 직접 호출
  - url: http://dev-commerce-service:8080
    description: dev 네임스페이스 내부 Service 주소
tags:
  - name: Orders
    description: 회원 본인 주문
  - name: Payments
    description: 회원 본인 결제 시도
  - name: Payment Groups
    description: 상품별 주문을 연결한 회원 본인 통합 결제
  - name: Cart
    description: Commerce 소유 장바구니
  - name: Sales Admin
    description: SELLER 판매·재고 관리
  - name: Coupons
    description: 회원 쿠폰 수령·보유 조회
  - name: Internal Sales
    description: Shopping/Live 서비스 호출
  - name: Local Test
    description: 명시 활성화한 로컬 테스트 전용
paths:
  /v1/seller/coupons:
    get:
      tags: [Sales Admin]
      operationId: listSellerCoupons
      summary: 본인 쿠폰 목록
      description: 본인 쿠폰만 조회한다. page × size가 2147483647을 초과하면 400이다.
      x-required-roles: [SELLER]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 본인 쿠폰 페이지
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { const: true }
                  error: { type: 'null' }
                  data:
                    type: object
                    required: [items, page, size, totalElements]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Coupon' } }
                      page: { type: integer, minimum: 0 }
                      size: { type: integer, minimum: 1, maximum: 100 }
                      totalElements: { type: integer, minimum: 0 }
              example: { success: true, data: { items: [], page: 0, size: 20, totalElements: 0 }, error: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
    post:
      tags: [Sales Admin]
      operationId: createSellerCoupon
      summary: 판매자 정액 쿠폰 생성
      x-required-roles: [SELLER]
      description: 인증된 판매자 소유 상품만 대상으로 지정한다. 수량은 종류별 최대 10000장, 이벤트는 시작 포함·종료 제외 최대 720시간이다. 별도 만료 시각은 이벤트 종료 이상이다. 설정은 이벤트 시작 이후 변경할 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCoupon' }
            example: { name: 가을 쿠폰, fixedDiscount: 1000, issuanceLimit: 10000, startsAt: '2026-10-10T00:00:00Z', endsAt: '2026-11-09T00:00:00Z', expiresAt: '2026-11-10T00:00:00Z', productIds: [1] }
      responses:
        '201':
          description: 쿠폰과 대상 상품 저장 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponEnvelope' }
              example: { success: true, data: { id: '33333333-3333-4333-8333-333333333334', sellerId: '33333333-3333-4333-8333-333333333333', name: 가을 쿠폰, fixedDiscount: 1000, issuanceLimit: 10000, issuedCount: 0, startsAt: '2026-10-10T00:00:00Z', endsAt: '2026-11-09T00:00:00Z', expiresAt: '2026-11-10T00:00:00Z', version: 0, productIds: [1] }, error: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ShoppingUnavailable' }
  /v1/seller/coupons/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Sales Admin]
      operationId: getSellerCoupon
      summary: 본인 쿠폰 상세
      x-required-roles: [SELLER]
      responses:
        '200':
          description: 쿠폰 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
    patch:
      tags: [Sales Admin]
      operationId: updateSellerCoupon
      summary: 발급 이벤트 시작 전 쿠폰 설정 수정
      x-required-roles: [SELLER]
      description: 현재 version과 전체 settings를 전달한다. 행 잠금 이후 서버 시각을 확인하며 기존 이벤트 시작 시각 이상이거나 version이 다르면 409이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, settings]
              properties:
                version: { type: integer, format: int64, minimum: 0 }
                settings: { $ref: '#/components/schemas/CreateCoupon' }
      responses:
        '200':
          description: 변경된 쿠폰 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ShoppingUnavailable' }
  /v1/coupons:
    get:
      tags: [Coupons]
      operationId: listClaimableCoupons
      summary: 회원이 수령할 수 있는 쿠폰 조회
      x-required-roles: [USER, SELLER]
      description: 현재 이벤트 중이고 수량이 남은 쿠폰. 같은 종류를 이미 수령한 회원에게는 노출하지 않는다. 이벤트 종료와 쿠폰 사용 만료는 별도다.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 수령 가능한 쿠폰 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailableCouponsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /v1/coupons/{id}/claims:
    post:
      tags: [Coupons]
      operationId: claimCoupon
      summary: 쿠폰 수령
      x-required-roles: [USER, SELLER]
      description: 같은 회원·쿠폰의 재요청은 기존 수령 결과를 반환하며 추가 발급하지 않는다. 회원은 같은 종류를 한 번만 수령할 수 있고 환불 후에도 재수령할 수 없다. 이벤트 시작은 포함, 종료는 제외한다.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: 새 쿠폰 수령 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberCouponEnvelope' }
        '200':
          description: 같은 회원의 기존 수령 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberCouponEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /v1/me/coupons:
    get:
      tags: [Coupons]
      operationId: listMyCoupons
      summary: 내 쿠폰과 상태 조회
      x-required-roles: [USER, SELLER]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 수령 이력과 현재 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberCouponsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /v1/orders/checkout:
    get:
      tags: ["Orders"]
      summary: "주문 가능 여부와 최신 금액 확인"
      operationId: "previewOrder"
      description: "재고·쿠폰 예약 없음. couponId가 있으면 회원 보유·사용 가능 기간 및 상품 대상 여부를 서버에서 검증한다. 쿠폰 적용 대상 상품을 주문할 수 없는 경우도 409. 주문 생성 때 가격·판매·재고를 다시 검사한다. 곱셈 overflow는 400."
      parameters: [{"name": "productId", "in": "query", "required": true, "schema": {"type": "integer", "format": "int64", "minimum": 1}}, {"name": "quantity", "in": "query", "required": true, "schema": {"type": "string", "pattern": "^[1-9][0-9]{0,8}$"}}, {"name": "couponId", "in": "query", "required": false, "schema": {"type": "string", "maxLength": 64}}]
      x-required-roles: ["USER", "SELLER"]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/OrderCheckout"}
              examples:
                normal: {"value": {"productId": 1, "salesId": 1, "productName": "가을 니트", "unitPrice": 15000, "quantity": 2, "totalAmount": 30000, "available": 10, "salesStatus": "ON_SALE", "orderable": true, "reason": null, "couponId": null, "discountAmount": 0, "payableAmount": 30000}}
                couponApplied: {"value": {"productId": 1, "salesId": 1, "productName": "가을 니트", "unitPrice": 15000, "quantity": 2, "totalAmount": 30000, "available": 10, "salesStatus": "ON_SALE", "orderable": true, "reason": null, "couponId": "33333333-3333-4333-8333-333333333334", "discountAmount": 5000, "payableAmount": 25000}}
                soldOut: {"value": {"productId": 1, "salesId": 1, "productName": "가을 니트", "unitPrice": 15000, "quantity": 2, "totalAmount": 30000, "available": 0, "salesStatus": "SOLD_OUT", "orderable": false, "reason": "SOLD_OUT", "couponId": null, "discountAmount": 0, "payableAmount": 30000}}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "503": {"$ref": "#/components/responses/ShoppingUnavailable"}
  /v1/orders:
    post:
      tags: ["Orders"]
      summary: "회원 단건 주문 생성"
      operationId: "createOrder"
      description: "couponId는 선택이며 지정 시 보유 쿠폰과 대상 상품을 검증해 할인액·실부담액을 저장하고 결제 묶음에서 예약한다. expectedTotalAmount는 할인 전 주문 총액이다. 서로 다른 회원은 같은 키를 독립 사용한다. 같은 회원의 키 재사용은 상품·수량·구매자 정보·expectedTotalAmount·couponId를 비교한다. 단건도 주문 하나를 가진 결제 묶음으로 생성하고 groupNumber를 반환한다. 회원당 활성 묶음은 하나이며 PENDING_PAYMENT/PAYMENT_CONFIRMING 중 다른 새 주문은 409, 동일 입력 재전송은 허용한다. 새 주문 저장·재고 예약·쿠폰 예약은 원자적이며 결제 전 기한은 15분이다."
      parameters: [{"$ref": "#/components/parameters/OptionalIdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/CreateOrderRequest"}
            example: {"productId": 1, "quantity": 2, "buyerName": "구매자", "buyerPhone": "010-1234-5678", "expectedTotalAmount": 30000, "couponId": "coupon-uuid"}
      x-required-roles: ["USER", "SELLER"]
      responses:
        "201":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Order"}
              examples:
                created: {"value": {"orderNumber": "20261001-000001", "productName": "가을 니트", "quantity": 2, "unitPrice": 15000, "totalAmount": 30000, "discountAmount": 0, "payableAmount": 30000, "status": "PENDING_PAYMENT", "buyerName": "구매자", "createdAt": "2026-10-01T00:00:00Z", "expiresAt": "2026-10-01T00:15:00Z", "cancelledAt": null, "groupNumber": "PG-00000000-0000-0000-0000-000000000149"}}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "503": {"$ref": "#/components/responses/ShoppingUnavailable"}
        "200":
          description: "동일 회원·멱등키·입력 재전송"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Order"}
              examples:
                replay: {"value": {"orderNumber": "20261001-000001", "productName": "가을 니트", "quantity": 2, "unitPrice": 15000, "totalAmount": 30000, "discountAmount": 0, "payableAmount": 30000, "status": "PENDING_PAYMENT", "buyerName": "구매자", "createdAt": "2026-10-01T00:00:00Z", "expiresAt": "2026-10-01T00:15:00Z", "cancelledAt": null, "groupNumber": "PG-00000000-0000-0000-0000-000000000149"}}
    get:
      tags: ["Orders"]
      summary: "본인 주문 내역"
      operationId: "listMyOrders"
      description: "createdAt 및 id 내림차순. SELLER도 본인 거래만 조회한다."
      parameters: [{"name": "page", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 0, "default": 0}}, {"name": "size", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 20}}]
      x-required-roles: ["USER", "SELLER"]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/OrderHistory"}
              examples:
                normal: {"value": {"items": [{"orderNumber": "20261001-000001", "productName": "가을 니트", "quantity": 2, "unitPrice": 15000, "totalAmount": 30000, "discountAmount": 0, "payableAmount": 30000, "status": "PENDING_PAYMENT", "buyerName": "구매자", "createdAt": "2026-10-01T00:00:00Z", "expiresAt": "2026-10-01T00:15:00Z", "cancelledAt": null, "groupNumber": "PG-00000000-0000-0000-0000-000000000149"}], "page": 0, "size": 20, "totalElements": 1, "totalPages": 1}}
                empty: {"value": {"items": [], "page": 0, "size": 20, "totalElements": 0, "totalPages": 0}}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /v1/orders/{orderNumber}:
    parameters: [{"$ref": "#/components/parameters/OrderNumber"}]
    get:
      tags: ["Orders"]
      summary: "본인 주문 조회"
      operationId: "getMyOrder"
      x-required-roles: ["USER", "SELLER"]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Order"}
              examples:
                normal: {"value": {"orderNumber": "20261001-000001", "productName": "가을 니트", "quantity": 2, "unitPrice": 15000, "totalAmount": 30000, "discountAmount": 0, "payableAmount": 30000, "status": "PENDING_PAYMENT", "buyerName": "구매자", "createdAt": "2026-10-01T00:00:00Z", "expiresAt": "2026-10-01T00:15:00Z", "cancelledAt": null, "groupNumber": "PG-00000000-0000-0000-0000-000000000149"}}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /v1/orders/{orderNumber}/cancel:
    parameters: [{"$ref": "#/components/parameters/OrderNumber"}]
    post:
      tags: ["Orders"]
      summary: "결제 전 본인 주문 취소"
      operationId: "cancelMyOrder"
      description: "여러 주문이 연결된 묶음의 개별 주문 취소는 409이며 묶음 전체 취소 API를 사용한다. 단건 묶음은 기존 주문 경로로 전체 취소하고 CANCELLED 재전송은 204. 그룹 없는 기존 주문의 반복 취소와 결제 진행·완료·실패·만료는 409."
      x-required-roles: ["USER", "SELLER"]
      responses:
        "204": {"description": "취소 및 예약 재고 복구, 본문 없음"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /v1/orders/{orderNumber}/payments:
    parameters: [{"$ref": "#/components/parameters/OrderNumber"}]
    post:
