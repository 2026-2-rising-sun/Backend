openapi: 3.1.0
info:
  title: Live Service API
  version: 1.0.0
  description: |
    Live P1 방송 API. 컨트롤러 경로는 `/v1` 이고 게이트웨이 외부 prefix 는 `/api/live` 다.

    - 성공 응답은 공통 `ApiResponse` 봉투를 쓰고 DELETE 성공은 204 무본문이다.
    - 오류는 입력 400 / 미존재 404 / 상태·version·중복 409 / 외부 장애 503 으로 구분한다.
    - 공개 응답에는 채널 ARN·등록 키·fingerprint·송출키·자격증명을 넣지 않는다.
    - 인증·역할·소유권은 P1 범위가 아니다(B5: 배포 시 관리·내부 경로 접근 범위 확인 필요).

servers:
  - url: http://localhost:8084
    description: 로컬
  - url: http://live-service:8084
    description: dev 네임스페이스
  - url: https://api.example.com/api/live
    description: 게이트웨이 경유(placeholder)

tags:
  - name: Admin Broadcast
    description: 관리 방송 등록·수정·조회·시작·종료 (#59 #60 #65 #66)
  - name: Admin Broadcast Product
    description: 관리 방송 상품 연결·해제·정렬·조회 (#62 #63 #67)
  - name: Public Broadcast
    description: 비회원 공개 방송 조회·시청 연결 (#61 #64)
  - name: Public Broadcast Product
    description: 비회원 방송 상품 조회·구매 진입 (#67)

paths:
  /v1/admin/broadcasts:
    post:
      summary: 방송 등록 (#59)
      description: |
        PREPARING 으로 저장한다. 과거 예정 시각도 허용하며 AWS 송출 여부는 조회하지 않는다.
        `Idempotency-Key` 는 방송 레코드 수명 동안 unique 하다. 같은 키·동일 입력은 같은 id 를
        돌려주고, 같은 키·다른 입력은 409 다.
      operationId: registerBroadcast
      tags: [Admin Broadcast]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BroadcastInput' }
            example:
              title: 가을 신상 라이브
              scheduledAt: '2026-10-01T20:00:00+09:00'
              channelArn: arn:aws:ivs:ap-northeast-2:123456789012:channel/abcDEF
              playbackUrl: https://abcdef.live-video.net/api/video/v1/ap-northeast-2.playlist.m3u8
      responses:
        '201':
          description: 등록됨(같은 키·동일 입력의 재요청도 같은 방송)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 같은 등록 키에 다른 요청 본문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                data: null
                error:
                  code: CONFLICT
                  message: 같은 등록 키에 다른 요청을 사용할 수 없습니다.
                  requestId: 6f1c1f0e-1d2a-4a3b-9c8d-0e1f2a3b4c5d
    get:
      summary: 관리 방송 목록 (#60)
      description: |
        상품·IVS 호출 없이 기본정보만 읽는다. 기본 정렬은 createdAt DESC, id DESC 이고
        상태 필터는 준비 scheduledAt ASC, 진행 startedAt DESC, 종료 endedAt DESC 다.
      operationId: listBroadcasts
      tags: [Admin Broadcast]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BroadcastStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/admin/broadcasts/{id}:
    parameters:
      - $ref: '#/components/parameters/BroadcastId'
    get:
      summary: 관리 방송 상세 (#60)
      operationId: getBroadcast
      tags: [Admin Broadcast]
      responses:
        '200':
          description: 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: 방송 기본정보 수정 (#59)
      description: |
        PREPARING 에서만 허용한다. 생략한 필드는 기존 값을 유지하고 본문에 명시적으로 null 을
        준 필드는 400 이다. `channelArn` 과 `playbackUrl` 은 함께 변경해야 한다.
      operationId: editBroadcast
      tags: [Admin Broadcast]
      parameters:
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BroadcastPatchInput' }
            example:
              title: 가을 신상 라이브(수정)
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: PREPARING 이 아니거나 version 이 어긋남
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/admin/broadcasts/{id}/start:
    post:
      summary: 방송 시작 (#65)
      description: |
        IVS LIVE+HEALTHY 와 채널-시청 URL 동일성, 현재 ON_SALE/SOLD_OUT 연결 상품 최소 1개를
        확인한 뒤 LIVE 로 전환한다. available 재고는 시작 판단에 쓰지 않는다.
        이미 LIVE 면 외부 재확인 없이 최초 startedAt 을 보존해 성공하고 ENDED 재시작은 409 다.
        같은 channelArn 으로 이미 진행 중인 방송이 있으면 409 다(DB partial unique index).
      operationId: startBroadcast
      tags: [Admin Broadcast]
      parameters:
        - $ref: '#/components/parameters/BroadcastId'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '200':
          description: LIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: IVS 미송출·URL 불일치·연결 상품 없음·version 충돌·종료 재시작·채널 중복
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                data: null
                error:
                  code: CONFLICT
                  message: IVS 채널이 아직 송출 중이 아닙니다.
                  requestId: 6f1c1f0e-1d2a-4a3b-9c8d-0e1f2a3b4c5d
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/admin/broadcasts/{id}/end:
    post:
      summary: 방송 종료 (#66)
      description: |
        LIVE 를 ENDED 로 바꾸고 최초 endedAt 을 보존한다. 반복 종료는 성공하고 준비 종료는 409 다.
        결제·주문·판매 상태·재고에 영향을 주지 않으며 OBS 는 운영자가 수동으로 중단한다.
      operationId: endBroadcast
      tags: [Admin Broadcast]
      parameters:
        - $ref: '#/components/parameters/BroadcastId'
      responses:
        '200':
          description: ENDED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 준비 상태 방송의 종료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/admin/broadcasts/{id}/products:
    parameters:
      - $ref: '#/components/parameters/BroadcastId'
    post:
      summary: 방송 상품 연결 (#62)
      description: |
        Shopping 의 상품 존재와 Commerce 판매 상태를 확인한 뒤 ON_SALE/SOLD_OUT 만 연결한다.
        PREPARING/LIVE 에서만 허용하고 방송당 최대 100개, 같은 productId 중복은 409 다.
      operationId: linkBroadcastProduct
      tags: [Admin Broadcast Product]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkProductInput' }
            example: { productId: 1024, expectedVersion: 3 }
      responses:
        '201':
          description: 연결됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastProductLinkEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: 방송 또는 상품·판매정보 미존재
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: 종료된 방송·version 충돌·중복 연결·최대 개수 초과·연결 불가 판매 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      summary: 관리 방송 상품 조회 (#67)
      description: |
        연결 순서로 Shopping 기본정보와 Commerce 최신 판매정보를 결합한다.
        정상 조회에서 사라진 연결도 linkId/position 과 `missing: true` 로 식별할 수 있다.
      operationId: listAdminBroadcastProducts
      tags: [Admin Broadcast Product]
      responses:
        '200':
          description: 연결 상품
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastProductViewEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/admin/broadcasts/{id}/products/order:
    put:
      summary: 방송 상품 노출 순서 변경 (#63)
      description: |
        이 방송의 전체 linkId 순열을 받아 한 번에 순서를 바꾼다. 중복·누락·타 방송 ID 는 400 이고
        성공·실패 모두 원자적이라 일부 순서만 남지 않는다. ENDED 는 변경할 수 없다.
      operationId: reorderBroadcastProducts
      tags: [Admin Broadcast Product]
      parameters:
        - $ref: '#/components/parameters/BroadcastId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderProductsInput' }
            example: { linkIds: [77, 75, 76], expectedVersion: 8 }
      responses:
        '200':
          description: 변경된 전체 순서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastProductLinkListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 종료된 방송 또는 version 충돌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/admin/broadcasts/{id}/products/{linkId}:
    delete:
      summary: 방송 상품 연결 해제 (#62)
      description: |
        방송 존재·상태를 먼저 검사한다. 같은 방송에서 이미 사라진 linkId 는 204 이고,
        다른 방송 소속으로 확인되면 404 다. LIVE 의 마지막 연결 상품 해제는 409 다.
      operationId: unlinkBroadcastProduct
      tags: [Admin Broadcast Product]
      parameters:
        - $ref: '#/components/parameters/BroadcastId'
        - name: linkId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204':
          description: 해제됨. 본문이 없다.
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: 방송 미존재 또는 다른 방송의 linkId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: 종료된 방송·version 충돌·LIVE 의 마지막 연결 상품
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                data: null
                error:
                  code: CONFLICT
                  message: 진행 중 방송의 마지막 연결 상품은 해제할 수 없습니다.
                  requestId: 6f1c1f0e-1d2a-4a3b-9c8d-0e1f2a3b4c5d

  /v1/broadcasts:
    get:
      summary: 공개 방송 목록 (#61)
      description: |
        로그인 없이 조회한다. LIVE → PREPARING → ENDED 그룹 순서이고 각 상태의 정렬을 쓴다.
        외부 호출 0회이므로 상품·영상 장애와 독립이다. 목록에는 videoStatus 를 채우지 않는다.
      operationId: listPublicBroadcasts
      tags: [Public Broadcast]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBroadcastPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/broadcasts/{id}:
    get:
      summary: 공개 방송 상세·시청 연결 (#61 #64)
      description: |
        `playbackUrl` 은 LIVE 에서만 반환한다. `playbackAllowed` 는 업무 상태이고
        `videoStatus` 는 지금 이 순간의 영상 신호다(LIVE 에서만 채운다). 둘은 분리되어 있어
        OBS 가 잠시 끊겨도 업무 상태 LIVE 는 유지된다. IVS 조회가 실패해도 이 응답은 200 이며
        `videoStatus: UNAVAILABLE` 로 표시된다. 종료된 방송은 재생 진입을 제공하지 않는다.
        시청은 IVS → FE 직접 재생이며 Live API 는 영상 프록시가 아니다.
      operationId: getPublicBroadcast
      tags: [Public Broadcast]
      parameters:
        - $ref: '#/components/parameters/BroadcastId'
      responses:
        '200':
          description: 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBroadcastEnvelope' }
              example:
                success: true
                error: null
                data:
                  id: 12
                  title: 가을 신상 라이브
                  scheduledAt: '2026-10-01T11:00:00Z'
                  status: 진행
                  playbackUrl: https://abcdef.live-video.net/api/video/v1/ap-northeast-2.playlist.m3u8
                  playbackAllowed: true
                  videoStatus: READY
                  createdAt: '2026-09-22T05:00:00Z'
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/broadcasts/{id}/products:
    get:
      summary: 공개 방송 상품 조회·구매 진입 (#67)
      description: |
        ON_SALE/SOLD_OUT 만 노출하고 READY/PRIVATE·정상 조회에서 삭제된 상품은 제외한다.
        품절은 구매 불가다. FE 는 productId/salesId 를 그대로 일반 주문 흐름에 넘기며
        Live 전용 주문·결제 API 는 없다. 최종 가격·재고 판정은 Commerce 가 한다.
        필수 외부 조회가 실패하면 빈 목록으로 숨기지 않고 503 을 반환한다.
      operationId: listPublicBroadcastProducts
      tags: [Public Broadcast Product]
      parameters:
        - $ref: '#/components/parameters/BroadcastId'
      responses:
        '200':
          description: 공개 상품
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastProductViewEnvelope' }
              example:
                success: true
                error: null
                data:
                  - linkId: 75
                    position: 0
                    productId: 1024
                    salesId: 5501
                    name: 가을 니트
                    mainImageUrl: /img/products/1024.png
                    price: 39000
                    status: ON_SALE
                    purchasable: true
                    missing: false
                  - linkId: 76
                    position: 1
                    productId: 1025
                    salesId: 5502
                    name: 가을 코트
                    mainImageUrl: null
                    price: 129000
                    status: SOLD_OUT
                    purchasable: false
                    missing: false
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  parameters:
    BroadcastId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1~128자의 영숫자와 `-`, `_`. 방송 레코드 수명 동안 unique 하다.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
      example: broadcast-2026-10-01-001
    Version:
      name: version
      in: query
      required: true
      description: 마지막으로 조회한 방송 version. 어긋나면 409 다.
      schema: { type: integer, format: int64, minimum: 0 }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      description: 마지막으로 조회한 방송 version. 어긋나면 409 다.
      schema: { type: integer, format: int64, minimum: 0 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: 입력이 올바르지 않다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: INVALID_REQUEST
              message: '제목은 1~100자여야 합니다.'
              requestId: 6f1c1f0e-1d2a-4a3b-9c8d-0e1f2a3b4c5d
    NotFound:
      description: 대상이 없다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: NOT_FOUND
              message: 방송을 찾을 수 없습니다.
              requestId: 6f1c1f0e-1d2a-4a3b-9c8d-0e1f2a3b4c5d
    ServiceUnavailable:
      description: 외부 서비스(Shopping/Commerce/IVS) 장애. 업무 조건 불충족(409)과 구분한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: SERVICE_UNAVAILABLE
              message: 상품 정보를 조회할 수 없습니다.
              requestId: 6f1c1f0e-1d2a-4a3b-9c8d-0e1f2a3b4c5d

  schemas:
    BroadcastStatus:
      type: string
      enum: [PREPARING, LIVE, ENDED]
    IvsReadiness:
      type: string
      description: 영상 신호 상태. 업무 상태와 분리된다.
      enum: [READY, NOT_READY, UNAVAILABLE]

    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, NOT_FOUND, CONFLICT, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
        message: { type: string }
        requestId: { type: ['string', 'null'] }
    ErrorEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: false }
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/ApiError' }

    BroadcastInput:
      type: object
      required: [title, scheduledAt, channelArn, playbackUrl]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        scheduledAt:
          type: string
          format: date-time
          description: offset 을 포함한 ISO-8601. 과거 시각도 허용한다. UI 는 KST 로 표시한다.
        channelArn: { type: string, minLength: 1, maxLength: 255 }
        playbackUrl: { type: string, minLength: 1, maxLength: 2048 }
    BroadcastPatchInput:
      type: object
      description: |
        생략한 필드는 기존 값을 유지한다. 명시적 null 은 400 이다.
        channelArn 과 playbackUrl 은 함께 변경해야 한다.
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        scheduledAt: { type: string, format: date-time }
        channelArn: { type: string, minLength: 1, maxLength: 255 }
        playbackUrl: { type: string, minLength: 1, maxLength: 2048 }
      additionalProperties: false

    Broadcast:
      type: object
      description: 관리 응답. 운영자가 채널·시청 URL 일치를 확인해야 하므로 IVS 필드를 포함한다.
      required: [id, title, scheduledAt, status, version]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        scheduledAt: { type: string, format: date-time }
        channelArn: { type: string }
        playbackUrl: { type: string }
        status: { $ref: '#/components/schemas/BroadcastStatus' }
        startedAt: { type: ['string', 'null'], format: date-time }
        endedAt: { type: ['string', 'null'], format: date-time }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicBroadcast:
      type: object
      description: 공개 응답. 채널 ARN·등록 키·fingerprint 를 포함하지 않는다.
      required: [id, title, scheduledAt, status, playbackAllowed]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        scheduledAt: { type: string, format: date-time }
        status: { type: string, enum: [예정, 진행, 종료] }
        playbackUrl:
          type: ['string', 'null']
          description: LIVE 에서만 반환한다.
        playbackAllowed:
          type: boolean
          description: 업무 상태다. 현재 영상 신호를 보장하지 않는다.
        videoStatus:
          oneOf:
            - $ref: '#/components/schemas/IvsReadiness'
            - type: 'null'
          description: LIVE 상세에서만 채운다. 목록과 비 LIVE 상세에서는 null 이다.
        createdAt: { type: string, format: date-time }

    LinkProductInput:
      type: object
      required: [productId, expectedVersion]
      properties:
        productId:
          type: integer
          format: int64
          minimum: 1
          description: Shopping 상품 식별자. Commerce salesId 와 같은 값이라고 가정하지 않는다.
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    ReorderProductsInput:
      type: object
      required: [linkIds, expectedVersion]
      properties:
        linkIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: integer, format: int64 }
          description: 이 방송의 전체 연결 linkId 순열.
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    BroadcastProductLink:
      type: object
      required: [linkId, productId, salesId, position, broadcastVersion]
      properties:
        linkId: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        salesId: { type: integer, format: int64 }
        position: { type: integer, minimum: 0 }
        broadcastVersion: { type: integer, format: int64 }
    BroadcastProductView:
      type: object
      required: [linkId, position, productId, purchasable, missing]
      properties:
        linkId: { type: integer, format: int64 }
        position: { type: integer, minimum: 0 }
        productId: { type: integer, format: int64 }
        salesId: { type: ['integer', 'null'], format: int64 }
        name: { type: ['string', 'null'] }
        mainImageUrl:
          type: ['string', 'null']
          description: null 은 기본 이미지 표시. 상대 URL 은 게이트웨이 기준으로 해석한다.
        price: { type: ['integer', 'null'], format: int64, description: KRW 정수 }
        status:
          type: ['string', 'null']
          enum: [ON_SALE, SOLD_OUT, READY, PRIVATE, null]
        purchasable:
          type: boolean
          description: 품절은 false. 최종 판정은 Commerce 가 다시 한다.
        missing:
          type: boolean
          description: 정상 조회에서 사라진 연결. 관리 응답에서만 true 가 될 수 있다.

    BroadcastEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Broadcast' }
        error: { type: 'null' }
    BroadcastPageEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Broadcast' }
            number: { type: integer }
            size: { type: integer }
            totalElements: { type: integer, format: int64 }
            totalPages: { type: integer }
        error: { type: 'null' }
    PublicBroadcastEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/PublicBroadcast' }
        error: { type: 'null' }
    PublicBroadcastPageEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/PublicBroadcast' }
            number: { type: integer }
            size: { type: integer }
            totalElements: { type: integer, format: int64 }
            totalPages: { type: integer }
        error: { type: 'null' }
    BroadcastProductLinkEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/BroadcastProductLink' }
        error: { type: 'null' }
    BroadcastProductLinkListEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/BroadcastProductLink' }
        error: { type: 'null' }
    BroadcastProductViewEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/BroadcastProductView' }
        error: { type: 'null' }
