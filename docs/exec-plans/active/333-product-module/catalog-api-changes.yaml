components:
  schemas:
    PurchaseCheck:
      type: object
      required:
      - productId
      - quantity
      - orderable
      - reason
      - maxQuantity
      - unitPrice
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
        orderable:
          type: boolean
        reason:
          type:
          - string
          - 'null'
          enum:
          - SALE_SUSPENDED
          - SOLD_OUT
          - EXCEEDS_STOCK
          - null
          description: 상품 전체 중지는 SALE_SUSPENDED, SKU 품절은 SOLD_OUT, 수량 초과는 EXCEEDS_STOCK이며 주문 가능하면 null이다.
        maxQuantity:
          type: integer
        unitPrice:
          type: integer
          format: int64
