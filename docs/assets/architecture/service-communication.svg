<text x="72" y="1080" font-size="22" fill="#52657e" font-weight="400" text-anchor="start">Catalog 판매 조회는 replica가 기본이며, 더 큰 버전의 이벤트만 사본에 반영합니다.</text>
<text x="72" y="1120" font-size="22" fill="#52657e" font-weight="400" text-anchor="start">상품·판매·쿠폰·방송·프로모션·Payment 결과는 상태 변경과 Outbox를 함께 저장합니다.</text>
<text x="72" y="1156" font-size="20" fill="#52657e" font-weight="400" text-anchor="start">Live 프로모션 이벤트도 발행하며, 위 화살표는 현재 주요 소비 경로를 표시합니다.</text>
