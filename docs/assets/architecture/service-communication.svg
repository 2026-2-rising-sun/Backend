<text x="1024" y="767" font-size="20" text-anchor="start">snapshotVersion 비교 후 반영</text>
<text x="64" y="804" font-size="21" text-anchor="start" style="fill:#52657e">조회 원본: HTTP가 기본이며, replica 설정으로 판매정보 사본 조회를 선택한다.</text>
<rect x="64" y="842" width="250" height="64" rx="16" fill="#fff4e9" stroke="#c05b12" stroke-width="1.5"/>
<text x="189" y="882" font-size="22" text-anchor="middle" style="fill:#c05b12" class="title">Commerce Outbox</text>
