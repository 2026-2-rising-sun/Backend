      - any-glob-to-any-file: "services/member-service/**"

service:shopping:
  - changed-files:
      - any-glob-to-any-file: "services/shopping-service/**"

service:commerce:
  - changed-files:
      - any-glob-to-any-file: "services/commerce-service/**"

service:live:
  - changed-files:
      - any-glob-to-any-file: "services/live-service/**"

service:notification:
  - changed-files:
      - any-glob-to-any-file: "services/notification-service/**"

common-module:
  - changed-files:
      - any-glob-to-any-file: "common-module/**"

contracts:
  - changed-files:
