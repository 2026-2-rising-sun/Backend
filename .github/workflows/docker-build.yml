name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'contracts/**'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: 2026-2-rising-sun

permissions:
  contents: read
  packages: write

jobs:
  # 서비스 x 아키텍처 조합마다 해당 아키텍처의 GitHub 호스팅 러너에서 네이티브로 빌드한다.
  # 이전에는 linux/amd64 러너 위에서 QEMU로 linux/arm64 를 에뮬레이션했는데, Gradle/JVM 빌드처럼
  # CPU 의존적인 작업은 에뮬레이션 페널티가 커서 서비스 1개 빌드 시간의 70% 이상이 arm64 에뮬레이션에
  # 쓰였다(실측: dependencies 단계만 19분). amd64/arm64를 각각 네이티브 러너에서 병렬로 돌려 이 비용을 없앤다.
  #
  # 각 job은 자기 아키텍처의 이미지를 digest로만 push하고(태그를 아직 확정하지 않음), digest를
  # artifact로 남긴다. 최종 태그(:latest, :sha) 부여와 멀티아키텍처 manifest 조립은 merge job에서 한다.
  build:
    strategy:
      fail-fast: false
      # 서비스 5개 x 아키텍처 2개 = 10개 조합을 모두 동시에 돌린다.
      #
      # 이전에는 Maven Central 429 를 우려해 2로 묶어 뒀지만, 그 구성에서도 job 하나가
      # amd64/arm64 두 개의 Gradle 프로세스를 동시에 돌렸으므로 실질 동시 요청은 이미 4였다.
      # 네이티브 러너로 분리한 뒤 4로 실행해 본 결과(run 35185527468) 429 없이 job당 2분대로
      # 끝났고, 대신 3개 웨이브로 나뉘어 전체 시간이 job 하나 시간의 3배가 됐다.
      # 웨이브를 없애면 전체 시간이 가장 느린 job 하나 수준으로 수렴한다.
      # 429 가 다시 보이면 이 값을 낮추는 것이 첫 번째 대응이다.
      max-parallel: 10
      matrix:
        service:
          - member-service
          - shopping-service
          - commerce-service
          - live-service
          - notification-service
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }} (linux/${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # 서비스별로 amd64/arm64 digest 두 개를 모아 하나의 멀티아키텍처 manifest 로 합치고
  # 여기서 비로소 :latest, :<sha> 태그를 붙여 push한다. build job이 하나라도 실패하면
  # 이 job은 실행되지 않으므로, 기존 :latest 는 그대로 남는다(반쪽짜리 이미지로 덮어써지지 않음).
  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - member-service
          - shopping-service
          - commerce-service
          - live-service
          - notification-service
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest"
