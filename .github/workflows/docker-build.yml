name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'contracts/**'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: 2026-2-rising-sun

permissions:
  contents: read
  packages: write

jobs:
  # 서비스 x 아키텍처 조합마다 해당 아키텍처의 GitHub 호스팅 러너에서 네이티브로 빌드한다.
  # 이전에는 linux/amd64 러너 위에서 QEMU로 linux/arm64 를 에뮬레이션했는데, Gradle/JVM 빌드처럼
  # CPU 의존적인 작업은 에뮬레이션 페널티가 커서 서비스 1개 빌드 시간의 70% 이상이 arm64 에뮬레이션에
  # 쓰였다(실측: dependencies 단계만 19분). amd64/arm64를 각각 네이티브 러너에서 병렬로 돌려 이 비용을 없앤다.
  #
  # 각 job은 자기 아키텍처의 이미지를 digest로만 push하고(태그를 아직 확정하지 않음), digest를
  # artifact로 남긴다. 최종 태그(:latest, :sha) 부여와 멀티아키텍처 manifest 조립은 merge job에서 한다.
  build:
    strategy:
      fail-fast: false
      # 서비스 5개 x 아키텍처 2개 = 10개 조합. 이전 구성(서비스 2개를 동시에, 각각 amd64+arm64를
      # 한 buildx 인스턴스 안에서 동시 진행)도 실질적으로 최대 4개의 Gradle 프로세스가 동시에
      # Maven Central에 요청을 보내는 상태였다(429 방지 코멘트의 근거). 이번 구조에서 job 1개당
      # Gradle 프로세스는 1개뿐이므로, max-parallel: 4 로 두면 이전과 같은 동시 요청 수준을 유지하면서도
      # 아키텍처별 대기 없이 진행할 수 있다. 429가 재현되면 낮추고, 문제 없으면 올려도 된다.
      max-parallel: 4
      matrix:
        service:
          - member-service
          - shopping-service
          - commerce-service
          - live-service
          - notification-service
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }} (linux/${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # 서비스별로 amd64/arm64 digest 두 개를 모아 하나의 멀티아키텍처 manifest 로 합치고
  # 여기서 비로소 :latest, :<sha> 태그를 붙여 push한다. build job이 하나라도 실패하면
  # 이 job은 실행되지 않으므로, 기존 :latest 는 그대로 남는다(반쪽짜리 이미지로 덮어써지지 않음).
  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - member-service
          - shopping-service
          - commerce-service
          - live-service
          - notification-service
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest"
