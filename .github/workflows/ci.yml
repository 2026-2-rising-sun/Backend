name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope (full regression by default; focused runs never publish)
        type: choice
        default: full
        options: [full, member, shopping, commerce, live, notification]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'auto' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.changes.outputs.plan }}
      full: ${{ steps.changes.outputs.full }}
      services: ${{ steps.changes.outputs.services }}
      tasks: ${{ steps.changes.outputs.tasks }}
      build: ${{ steps.changes.outputs.build }}
      postgres: ${{ steps.changes.outputs.postgres }}
      postgres_cases: ${{ steps.changes.outputs.postgres_cases }}
      contracts: ${{ steps.changes.outputs.contracts }}
      integration: ${{ steps.changes.outputs.integration }}
      integration_scope: ${{ steps.changes.outputs.integration_scope }}
      contract_services: ${{ steps.changes.outputs.contract_services }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select required verification
        id: changes
        run: python3 .github/scripts/ci_plan.py
      - name: Verify CI guards and planner
        if: steps.changes.outputs.guards == 'true'
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          node --test .github/scripts/test_size_labeler.cjs
      - name: Validate workflow syntax and expressions
        if: steps.changes.outputs.guards == 'true'
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.tool_tests == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/contracts/package-lock.json
      - name: Verify contract and integration tooling without application startup
        if: steps.changes.outputs.tool_tests == 'true'
        run: |
          npm ci --prefix scripts/contracts --ignore-scripts
          npm test --prefix scripts/contracts
          for script in scripts/integration/*.cjs; do node --check "$script"; done

  build:
    name: Build & DB
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: ${{ needs.plan.outputs.postgres == 'true' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_CASES: ${{ needs.plan.outputs.postgres_cases }}
      MEMBER_TEST_DB_URL: jdbc:postgresql://localhost:55432/member_test
      MEMBER_TEST_DB_DRIVER: org.postgresql.Driver
      MEMBER_TEST_DB_USER: postgres
      MEMBER_TEST_DB_PASSWORD: test
      COMMERCE_TEST_POSTGRES_URL: jdbc:postgresql://localhost:55432/commerce_test
      COMMERCE_TEST_POSTGRES_USER: postgres
      COMMERCE_TEST_POSTGRES_PASSWORD: test
      LIVE_PG_TEST: ${{ contains(fromJSON(needs.plan.outputs.services), 'live') && '1' || '0' }}
      LIVE_PG_PORT: '55432'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Create selected disposable PostgreSQL databases
        if: needs.plan.outputs.postgres == 'true'
        env:
          PGPASSWORD: test
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          for case in json.loads(os.environ['POSTGRES_CASES']):
              subprocess.run(['createdb', '-h', 'localhost', '-p', '55432', '-U', 'postgres', case['database']], check=True)
          PYTHON
      - name: Build selected modules and database suites
        env:
          GRADLE_TASKS: ${{ needs.plan.outputs.tasks }}
        run: |
          read -ra tasks <<< "$GRADLE_TASKS"
          ./gradlew "${tasks[@]}" --no-daemon --continue --max-workers=2
      - name: Require selected regression reports
        if: always() && (needs.plan.outputs.full == 'true' || needs.plan.outputs.services != '[]')
        env:
          FULL: ${{ needs.plan.outputs.full }}
          SELECTED_SERVICES: ${{ needs.plan.outputs.services }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          patterns = [f'services/{service}-service/build/test-results/test/TEST-*.xml'
                      for service in json.loads(os.environ['SELECTED_SERVICES'])]
          required = []
          if os.environ['FULL'] == 'true':
              patterns.append('libs/*/build/test-results/test/TEST-*.xml')
              required = ['--require-suite', '*.MemberJwtDecoderTest']
          subprocess.run(['python3', '.github/scripts/check_test_results.py', *patterns, *required,
                          '--allow-skipped-suite', 'com.shoppinglive.live.broadcast.PostgresMigrationTest=4',
                          '--allow-skipped-suite', 'com.shoppinglive.commerce.migration.MemberCommerceMigrationPostgresTest=3',
                          '--output', 'build/ci/unit-tests.json'], check=True)
          PYTHON
      - name: Require every selected PostgreSQL suite
        if: always() && needs.plan.outputs.postgres == 'true'
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          failures = []
          for case in json.loads(os.environ['POSTGRES_CASES']):
              args = ['python3', '.github/scripts/check_test_results.py', case['report']]
              for suite in case['suites'].split():
                  args += ['--require-suite', suite]
              for minimum in case['minimums'].split():
                  args += ['--min-suite-tests', minimum]
              result = subprocess.run(args + ['--output', f"build/ci/postgres-{case['service']}.json"])
              if result.returncode:
                  failures.append(case['service'])
          if failures:
              raise SystemExit('PostgreSQL verification failed: ' + ', '.join(failures))
          PYTHON
      - name: Upload test reports
        if: always() && (needs.plan.outputs.full == 'true' || needs.plan.outputs.services != '[]')
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/ci/
          if-no-files-found: error
          retention-days: 7

  contracts:
    needs: plan
    if: needs.plan.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTRACT_SERVICES: ${{ needs.plan.outputs.contract_services }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/contracts/package-lock.json
      - run: npm ci --prefix scripts/contracts --ignore-scripts
      - run: npm run check --prefix scripts/contracts
      - name: Select event comparison base
        id: base
        run: python3 .github/scripts/contract_base.py
      - name: Verify contract change review hashes
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: node scripts/contracts/base-diff.cjs --base "$BASE_SHA"
      - name: Verify Prism named examples
        run: npm run smoke --prefix scripts/contracts
      - name: Upload contract and Prism reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ github.sha }}
          path: build/contracts/
          if-no-files-found: error
          retention-days: 7

  integration:
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INTEGRATION_SCOPE: ${{ needs.plan.outputs.integration_scope }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/contracts/package-lock.json
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci --prefix scripts/contracts --ignore-scripts
      - name: Run real service HTTP integration
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f scripts/integration/run.cjs
          node scripts/integration/run.cjs
      - name: Require complete integration evidence
        if: always()
        run: python3 .github/scripts/check_integration_results.py
      - name: Upload sanitized integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ github.sha }}
          path: build/integration/
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Quality gate
    needs: [plan, build, contracts, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Require planned jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: python3 .github/scripts/ci_gate.py

  publish:
    needs: [plan, quality-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.full == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      verified-sha: ${{ github.sha }}
