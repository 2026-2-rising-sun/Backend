name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.changes.outputs.plan }}
      full: ${{ steps.changes.outputs.full }}
      services: ${{ steps.changes.outputs.services }}
      tasks: ${{ steps.changes.outputs.tasks }}
      build: ${{ steps.changes.outputs.build }}
      postgres: ${{ steps.changes.outputs.postgres }}
      postgres_matrix: ${{ steps.changes.outputs.postgres_matrix }}
      contracts: ${{ steps.changes.outputs.contracts }}
      integration: ${{ steps.changes.outputs.integration }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify CI guards and planner
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          node --test .github/scripts/test_size_labeler.cjs
      - name: Select required verification
        id: changes
        run: python3 .github/scripts/ci_plan.py

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build selected modules and integration jars
        env:
          GRADLE_TASKS: ${{ needs.plan.outputs.tasks }}
        run: |
          read -ra tasks <<< "$GRADLE_TASKS"
          ./gradlew "${tasks[@]}" --no-daemon --continue --max-workers=2
      - name: Require selected regression reports
        if: always() && (needs.plan.outputs.full == 'true' || needs.plan.outputs.services != '[]')
        env:
          FULL: ${{ needs.plan.outputs.full }}
          SELECTED_SERVICES: ${{ needs.plan.outputs.services }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          patterns = [f'services/{service}-service/build/test-results/test/TEST-*.xml'
                      for service in json.loads(os.environ['SELECTED_SERVICES'])]
          required = []
          if os.environ['FULL'] == 'true':
              patterns.append('libs/*/build/test-results/test/TEST-*.xml')
              required = ['--require-suite', '*.MemberJwtDecoderTest']
          subprocess.run(['python3', '.github/scripts/check_test_results.py', *patterns, *required,
                          '--allow-skipped-suite', 'com.shoppinglive.live.broadcast.PostgresMigrationTest=4',
                          '--allow-skipped-suite', 'com.shoppinglive.commerce.migration.MemberCommerceMigrationPostgresTest=3',
                          '--output', 'build/ci/unit-tests.json'], check=True)
          PYTHON
      - name: Package integration application jars
        if: needs.plan.outputs.integration == 'true'
        run: |
          mkdir -p build
          printf '%s\n' "$GITHUB_SHA" > build/integration-jars.sha
          tar -cf build/integration-jars.tar \
            build/integration-jars.sha \
            services/member-service/build/libs/*-SNAPSHOT.jar \
            services/shopping-service/build/libs/*-SNAPSHOT.jar \
            services/commerce-service/build/libs/*-SNAPSHOT.jar \
            services/live-service/build/libs/*-SNAPSHOT.jar
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.integration == 'true'
        with:
          name: integration-jars-${{ github.sha }}
          path: build/integration-jars.tar
          if-no-files-found: error
          retention-days: 2
      - name: Upload test reports
        if: always() && (needs.plan.outputs.full == 'true' || needs.plan.outputs.services != '[]')
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/ci/
          if-no-files-found: error
          retention-days: 7

  postgres:
    needs: plan
    if: needs.plan.outputs.postgres == 'true'
    name: PostgreSQL (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.postgres_matrix) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MEMBER_TEST_DB_URL: jdbc:postgresql://localhost:55432/member_test
      MEMBER_TEST_DB_DRIVER: org.postgresql.Driver
      MEMBER_TEST_DB_USER: postgres
      MEMBER_TEST_DB_PASSWORD: test
      COMMERCE_TEST_POSTGRES_URL: jdbc:postgresql://localhost:55432/commerce_test
      COMMERCE_TEST_POSTGRES_USER: postgres
      COMMERCE_TEST_POSTGRES_PASSWORD: test
      LIVE_PG_TEST: '1'
      LIVE_PG_PORT: '55432'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Run required PostgreSQL suite
        env:
          GRADLE_TASK: ${{ matrix.task }}
        run: |
          read -ra task_args <<< "$GRADLE_TASK"
          ./gradlew "${task_args[@]}" --no-daemon --max-workers=2
      - name: Reject absent, skipped or failed database tests
        if: always()
        env:
          REQUIRED_SUITES: ${{ matrix.suites }}
          MINIMUM_SUITE_TESTS: ${{ matrix.minimums }}
          REPORT_GLOB: ${{ matrix.report }}
          SERVICE: ${{ matrix.service }}
        run: |
          read -ra suites <<< "$REQUIRED_SUITES"
          read -ra minimums <<< "$MINIMUM_SUITE_TESTS"
          required=()
          for suite in "${suites[@]}"; do required+=(--require-suite "$suite"); done
          for minimum in "${minimums[@]}"; do required+=(--min-suite-tests "$minimum"); done
          python3 .github/scripts/check_test_results.py "$REPORT_GLOB" \
            "${required[@]}" --output "build/ci/postgres-${SERVICE}.json"
      - name: Upload PostgreSQL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-${{ matrix.service }}-${{ github.sha }}
          path: |
            services/${{ matrix.service }}-service/build/reports/tests/
            services/${{ matrix.service }}-service/build/test-results/
            build/ci/
          if-no-files-found: error
          retention-days: 7

  contracts:
    needs: plan
    if: needs.plan.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/contracts/package-lock.json
      - run: npm ci --prefix scripts/contracts --ignore-scripts
      - run: npm run check --prefix scripts/contracts
      - name: Select event comparison base
        id: base
        run: python3 .github/scripts/contract_base.py
      - name: Verify contract change review hashes
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: node scripts/contracts/base-diff.cjs --base "$BASE_SHA"
      - name: Verify Prism named examples
        run: npm run smoke --prefix scripts/contracts
      - name: Upload contract and Prism reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ github.sha }}
          path: build/contracts/
          if-no-files-found: error
          retention-days: 7

  integration:
    needs: [plan, build]
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: integration-jars-${{ github.sha }}
          path: build
      - run: tar -xf build/integration-jars.tar
      - run: npm ci --prefix scripts/contracts --ignore-scripts
      - name: Run real service HTTP integration
        run: |
          test -f scripts/integration/run.cjs
          node scripts/integration/run.cjs
      - name: Require complete integration evidence
        if: always()
        run: python3 .github/scripts/check_integration_results.py
      - name: Upload sanitized integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ github.sha }}
          path: build/integration/
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Quality gate
    needs: [plan, build, postgres, contracts, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Require planned jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: python3 .github/scripts/ci_gate.py

  publish:
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      verified-sha: ${{ github.sha }}
