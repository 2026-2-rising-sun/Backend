name: PostgreSQL and Redis checks (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: shopping
            database: shopping_test
            task: :services:shopping-service:integrationTest --tests *ProductSellerMigrationTest --tests *ProductSalesRepositoryTest --tests *CouponDisplayRepositoryTest
            report: services/shopping-service/build/test-results/integrationTest/TEST-*.xml
            suites: '*.ProductSellerMigrationTest *.ProductSalesRepositoryTest *.CouponDisplayRepositoryTest'
            minimums: '*.ProductSellerMigrationTest=2 *.ProductSalesRepositoryTest=16 *.CouponDisplayRepositoryTest=16'
          - service: member
            database: member_test
            task: :services:member-service:postgresTest
            report: services/member-service/build/test-results/postgresTest/TEST-*.xml
            suites: '*.MemberPostgresTest *.MemberLoginPostgresTest *.MemberSessionPostgresTest'
            minimums: '*.MemberPostgresTest=1 *.MemberLoginPostgresTest=5 *.MemberSessionPostgresTest=16'
          - service: commerce
            database: commerce_test
            task: :services:commerce-service:postgresCommerceTest
            report: services/commerce-service/build/test-results/postgresCommerceTest/TEST-*.xml
            suites: '*.CouponSyncIntegrationTest *.SalesInfoEventIntegrationTest *.OrderCreationConcurrencyTest *.OrderCancellationConcurrencyTest *.SalesStockConcurrencyTest *.SalesStatusConcurrencyTest *.PaymentFlowIntegrationTest *.PaymentSchedulingAfterCommitTest *.PaymentDelayReconcilerTest *.OrderExpirationSchedulerTest *.CartOrderIntegrationTest *.MemberCommerceApiTest *.MemberCommerceMigrationPostgresTest *.PaymentGroupIntegrationTest *.PaymentRecoveryStorePostgresTest *.PaymentRecoveryPostgresTest *.DurableMockGatewayPostgresTest *.CouponClaimPostgresTest *.CouponPreviewPostgresTest *.CouponReservationPostgresTest *.RefundSchemaPostgresTest *.RefundIntakeServicePostgresTest *.DurableMockRefundGatewayPostgresTest *.RefundExecutionPostgresTest *.RefundExecutionConcurrencyPostgresTest *.RefundApiPostgresTest *.RefundRecoveryStorePostgresTest *.RefundRecoveryExecutionPostgresTest *.RefundReconcilerPostgresTest'
            minimums: '*.CouponSyncIntegrationTest=5 *.SalesInfoEventIntegrationTest=9 *.MemberCommerceMigrationPostgresTest=6 *.PaymentGroupIntegrationTest=26 *.PaymentRecoveryPostgresTest=9 *.PaymentRecoveryStorePostgresTest=6 *.DurableMockGatewayPostgresTest=4 *.CouponClaimPostgresTest=3 *.CouponPreviewPostgresTest=1 *.CouponReservationPostgresTest=3 *.RefundSchemaPostgresTest=3 *.RefundIntakeServicePostgresTest=7 *.DurableMockRefundGatewayPostgresTest=4 *.RefundExecutionPostgresTest=9 *.RefundExecutionConcurrencyPostgresTest=1 *.RefundApiPostgresTest=2 *.RefundRecoveryStorePostgresTest=6 *.RefundRecoveryExecutionPostgresTest=7 *.RefundReconcilerPostgresTest=8'
          - service: live
            database: live_test
            task: :services:live-service:integrationTest --tests *PostgresMigrationTest --tests *PostgresLikeTest --tests *ChatRealtimeRedisTest --tests *LikeRealtimeRedisTest
            report: services/live-service/build/test-results/integrationTest/TEST-*.xml
            suites: '*.PostgresMigrationTest *.PostgresLikeTest *.ChatRealtimeRedisTest *.LikeRealtimeRedisTest'
            minimums: '*.PostgresMigrationTest=9 *.PostgresLikeTest=5 *.ChatRealtimeRedisTest=3 *.LikeRealtimeRedisTest=2'
          - service: notification
            database: notification_test
            task: :services:notification-service:integrationTest --tests *NotificationServiceApplicationTests
            report: services/notification-service/build/test-results/integrationTest/TEST-*.xml
            suites: '*.NotificationServiceApplicationTests'
            minimums: '*.NotificationServiceApplicationTests=2'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOTIFICATION_TEST_POSTGRES_URL: jdbc:postgresql://localhost:55432/notification_test
      NOTIFICATION_TEST_DB_DRIVER: org.postgresql.Driver
      NOTIFICATION_TEST_DB_USER: postgres
      NOTIFICATION_TEST_DB_PASSWORD: test
      SHOPPING_TEST_POSTGRES_URL: jdbc:postgresql://localhost:55432/shopping_test
      SHOPPING_TEST_POSTGRES_USER: postgres
      SHOPPING_TEST_POSTGRES_PASSWORD: test
      LIVE_REDIS_TEST: '1'
      LIVE_REDIS_PORT: '56379'
      MEMBER_TEST_DB_URL: jdbc:postgresql://localhost:55432/member_test
      MEMBER_TEST_DB_DRIVER: org.postgresql.Driver
      MEMBER_TEST_DB_USER: postgres
      MEMBER_TEST_DB_PASSWORD: test
      COMMERCE_TEST_POSTGRES_URL: jdbc:postgresql://localhost:55432/commerce_test
      COMMERCE_TEST_POSTGRES_USER: postgres
      COMMERCE_TEST_POSTGRES_PASSWORD: test
      LIVE_PG_TEST: '1'
      LIVE_PG_PORT: '55432'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Run PostgreSQL suite
        env:
          GRADLE_TASK: ${{ matrix.task }}
        run: |
          read -ra task <<< "$GRADLE_TASK"
          ./gradlew "${task[@]}" --no-daemon --max-workers=2
      - name: Require database evidence
        if: always()
        env:
          REQUIRED_SUITES: ${{ matrix.suites }}
          MINIMUMS: ${{ matrix.minimums }}
          REPORT: ${{ matrix.report }}
          SERVICE: ${{ matrix.service }}
        run: |
          read -ra suites <<< "$REQUIRED_SUITES"
          read -ra minimums <<< "$MINIMUMS"
          required=()
          for suite in "${suites[@]}"; do required+=(--require-suite "$suite"); done
          for minimum in "${minimums[@]}"; do required+=(--min-suite-tests "$minimum"); done
          python3 .github/scripts/check_test_results.py "$REPORT" "${required[@]}" --output "build/ci/postgres-${SERVICE}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-${{ matrix.service }}-${{ github.sha }}
          path: |
            services/${{ matrix.service }}-service/build/test-results/
            build/ci/
          if-no-files-found: error
          retention-days: 7
