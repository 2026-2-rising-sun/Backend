name: Naming conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: naming-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  naming:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify naming checker
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_conventions.py'
      - name: Check issue or PR naming
        run: python3 .github/scripts/check_conventions.py
