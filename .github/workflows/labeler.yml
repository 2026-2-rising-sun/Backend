name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5

  size-label:
    runs-on: ubuntu-latest
    steps:
      - uses: codelytv/pr-size-labeler@v1.10.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/XS"
          xs_max_size: "9"
          s_label: "size/S"
          s_max_size: "29"
          m_label: "size/M"
          m_max_size: "99"
          l_label: "size/L"
          l_max_size: "499"
          xl_label: "size/XL"
          fail_if_xl: "false"
          # Count implementation, tests and executable configuration; omit prose and API documents.
          # v1.10.0 matches full filenames with Bash globs ('*' also spans directories).
          files_to_ignore: >-
            *.lock package-lock.json gradle-wrapper.jar
            *.md *.mdx *.rst *.adoc
            README*.txt */README*.txt docs/*.txt contracts/docs/*.txt
            contracts/api/*.yaml contracts/api/*.yml contracts/api/*.json
            contracts/docs/*.json contracts/docs/*.yaml contracts/docs/*.yml
            contracts/exports/*.json contracts/exports/*.yaml contracts/exports/*.yml
