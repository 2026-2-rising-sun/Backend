name: Live stack verification

on:
  pull_request:
    paths: ["services/live-service/**", "libs/**", "contracts/**", "scripts/integration/**", "scripts/contracts/**", ".github/scripts/**", ".github/workflows/live-verification.yml"]
  push:
    branches: [dev]
    paths: ["services/live-service/**", "libs/**", "contracts/**", "scripts/integration/**", "scripts/contracts/**", ".github/scripts/**", ".github/workflows/live-verification.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify CI report guards
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build and run all tests
        run: ./gradlew build --no-daemon --continue --max-workers=2
      - name: Require regression reports
        if: always()
        run: |
          python3 .github/scripts/check_test_results.py \
            'services/member-service/build/test-results/test/TEST-*.xml' \
            'services/shopping-service/build/test-results/test/TEST-*.xml' \
            'services/commerce-service/build/test-results/test/TEST-*.xml' \
            'services/live-service/build/test-results/test/TEST-*.xml' \
            'services/notification-service/build/test-results/test/TEST-*.xml' \
            'libs/*/build/test-results/test/TEST-*.xml' \
            --require-suite '*.MemberJwtDecoderTest' \
            --allow-skipped-suite com.shoppinglive.live.broadcast.PostgresMigrationTest=9 \
            --allow-skipped-suite com.shoppinglive.live.stream.application.ChatRealtimeRedisTest=3 \
            --allow-skipped-suite com.shoppinglive.live.like.PostgresLikeTest=5 \
            --allow-skipped-suite com.shoppinglive.live.stream.application.LikeRealtimeRedisTest=2 \
            --allow-skipped-suite com.shoppinglive.commerce.migration.MemberCommerceMigrationPostgresTest=5 \
            --allow-skipped-suite com.shoppinglive.shopping.product.ProductSellerMigrationTest=1 \
            --output build/ci/unit-tests.json
      - name: Package integration application jars
        run: |
          mkdir -p build
          printf '%s\n' "$GITHUB_SHA" > build/integration-jars.sha
          tar -cf build/integration-jars.tar \
            build/integration-jars.sha \
            services/member-service/build/libs/*-SNAPSHOT.jar \
            services/shopping-service/build/libs/*-SNAPSHOT.jar \
            services/commerce-service/build/libs/*-SNAPSHOT.jar \
            services/live-service/build/libs/*-SNAPSHOT.jar
      - uses: actions/upload-artifact@v4
        with:
          name: integration-jars-${{ github.sha }}
          path: build/integration-jars.tar
          if-no-files-found: error
          retention-days: 2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/ci/
          if-no-files-found: error
          retention-days: 7

  postgres:
    name: PostgreSQL (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: shopping
            database: shopping_test
            task: ':services:shopping-service:test --tests *ProductSellerMigrationTest'
            report: services/shopping-service/build/test-results/test/TEST-*.xml
            suites: '*.ProductSellerMigrationTest'
            minimums: '*.ProductSellerMigrationTest=2'
          - service: member
            database: member_test
            task: ':services:member-service:postgresTest'
            report: services/member-service/build/test-results/postgresTest/TEST-*.xml
            suites: '*.MemberPostgresTest *.MemberLoginPostgresTest *.MemberSessionPostgresTest'
            minimums: '*.MemberPostgresTest=1 *.MemberLoginPostgresTest=5 *.MemberSessionPostgresTest=16'
          - service: commerce
            database: commerce_test
            task: ':services:commerce-service:postgresCommerceTest'
            report: services/commerce-service/build/test-results/postgresCommerceTest/TEST-*.xml
            suites: '*.OrderCreationConcurrencyTest *.OrderCancellationConcurrencyTest *.SalesStockConcurrencyTest *.SalesStatusConcurrencyTest *.PaymentFlowIntegrationTest *.PaymentSchedulingAfterCommitTest *.PaymentDelayReconcilerTest *.OrderExpirationSchedulerTest *.CartOrderIntegrationTest *.MemberCommerceApiTest *.MemberCommerceMigrationPostgresTest *.PaymentGroupIntegrationTest'
            minimums: '*.MemberCommerceMigrationPostgresTest=5 *.PaymentGroupIntegrationTest=14'
          - service: live
            database: live_test
            # live 는 실제 Redis 검사도 이 job 에서 함께 돌린다.
            task: ':services:live-service:test --tests *PostgresMigrationTest --tests *ChatRealtimeRedisTest --tests *PostgresLikeTest --tests *LikeRealtimeRedisTest'
            report: services/live-service/build/test-results/test/TEST-*.xml
            suites: '*.PostgresMigrationTest *.ChatRealtimeRedisTest *.PostgresLikeTest *.LikeRealtimeRedisTest'
            minimums: '*.PostgresMigrationTest=9 *.ChatRealtimeRedisTest=3 *.PostgresLikeTest=5 *.LikeRealtimeRedisTest=2'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MEMBER_TEST_DB_URL: jdbc:postgresql://localhost:55432/member_test
      MEMBER_TEST_DB_DRIVER: org.postgresql.Driver
      MEMBER_TEST_DB_USER: postgres
      MEMBER_TEST_DB_PASSWORD: test
      COMMERCE_TEST_POSTGRES_URL: jdbc:postgresql://localhost:55432/commerce_test
      COMMERCE_TEST_POSTGRES_USER: postgres
      COMMERCE_TEST_POSTGRES_PASSWORD: test
      SHOPPING_TEST_POSTGRES_URL: jdbc:postgresql://localhost:55432/shopping_test
      SHOPPING_TEST_POSTGRES_USER: postgres
      SHOPPING_TEST_POSTGRES_PASSWORD: test
      LIVE_PG_TEST: '1'
      LIVE_PG_PORT: '55432'
      LIVE_REDIS_TEST: '1'
      LIVE_REDIS_PORT: '56379'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Run required PostgreSQL suite
        env:
          GRADLE_TASK: ${{ matrix.task }}
        run: |
          read -ra task_args <<< "$GRADLE_TASK"
          ./gradlew "${task_args[@]}" --no-daemon --max-workers=2
      - name: Reject absent, skipped or failed database tests
        if: always()
        env:
          REQUIRED_SUITES: ${{ matrix.suites }}
          MINIMUM_SUITE_TESTS: ${{ matrix.minimums }}
          REPORT_GLOB: ${{ matrix.report }}
          SERVICE: ${{ matrix.service }}
        run: |
          read -ra suites <<< "$REQUIRED_SUITES"
          read -ra minimums <<< "$MINIMUM_SUITE_TESTS"
          required=()
          for suite in "${suites[@]}"; do required+=(--require-suite "$suite"); done
          for minimum in "${minimums[@]}"; do required+=(--min-suite-tests "$minimum"); done
          python3 .github/scripts/check_test_results.py "$REPORT_GLOB" \
            "${required[@]}" --output "build/ci/postgres-${SERVICE}.json"
      - name: Upload PostgreSQL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-${{ matrix.service }}-${{ github.sha }}
          path: |
            services/${{ matrix.service }}-service/build/reports/tests/
            services/${{ matrix.service }}-service/build/test-results/
            build/ci/
          if-no-files-found: error
          retention-days: 7

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/contracts/package-lock.json
      - run: npm ci --prefix scripts/contracts --ignore-scripts
      - run: npm run check --prefix scripts/contracts
      - name: Select event comparison base
        id: base
        run: python3 .github/scripts/contract_base.py
      - name: Verify contract change review hashes
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: node scripts/contracts/base-diff.cjs --base "$BASE_SHA"
      - name: Verify Prism named examples
        run: npm run smoke --prefix scripts/contracts
      - name: Upload contract and Prism reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ github.sha }}
          path: build/contracts/
          if-no-files-found: error
          retention-days: 7

  integration:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: integration-jars-${{ github.sha }}
          path: build
      - run: tar -xf build/integration-jars.tar
      - run: npm ci --prefix scripts/contracts --ignore-scripts
      - name: Run real service HTTP integration
        run: |
          test -f scripts/integration/run.cjs
          node scripts/integration/run.cjs
      - name: Require complete integration evidence
        if: always()
        run: python3 .github/scripts/check_integration_results.py
      - name: Upload sanitized integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ github.sha }}
          path: build/integration/
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Quality gate
    needs: [build, postgres, contracts, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('Verified commit: `' + os.environ['VERIFIED_SHA'] + '`\n\n')
              for name, job in results.items():
                  report.write(f"- {name}: {job['result']}\n")
              report.write('\nUnit and PostgreSQL counts overlap; they are separate evidence, not additive.\n')
          assert set(results) == {'build', 'postgres', 'contracts', 'integration'}
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
