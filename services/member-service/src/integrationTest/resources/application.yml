# 일반 테스트는 H2, migrationTest는 외부의 격리 PostgreSQL DB를 명시해 migration을 검증한다.
spring:
  datasource:
    url: ${MEMBER_TEST_DB_URL:jdbc:h2:mem:member;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${MEMBER_TEST_DB_DRIVER:org.h2.Driver}
    username: ${MEMBER_TEST_DB_USER:sa}
    password: ${MEMBER_TEST_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

# 서비스 기본 설정과 같은 Swagger 진입 경로를 사용한다.
springdoc:
  swagger-ui:
    path: /swagger
