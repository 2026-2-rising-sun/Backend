spring:
  application:
    name: commerce-service
  config:
    import: classpath:shoppinglive-resilience-defaults.yml
  jpa:
    # 스키마는 Flyway 가 소유한다. Hibernate 는 엔티티 매핑이 실제 스키마와 맞는지 검증만.
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8083

# 애플리케이션 도메인 설정.
commerce:
  order:
    # 결제 없이 방치된 주문의 자동 만료 유효시간. 팀 합의 시점에 최종 값 결정.
    expiration:
      duration: PT15M
  shopping-client:
    # 개발·통합 테스트 모드. 화요일 페어링에서 HttpShoppingClient 로 교체 시 http 로.
    mode: stub

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"

---
# 접속 정보는 Infra 레포 local/docker-compose.yml 과 같은 환경변수·기본값을 쓴다.
# 값을 바꾸려면 Infra 의 local/.env 와 여기를 함께 고쳐야 한다.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/commerce
    username: ${POSTGRES_USER:shoppinglive}
    password: ${POSTGRES_PASSWORD:changeme}
  kafka:
    # 호스트에서는 EXTERNAL 리스너로 붙는다 (컨테이너 내부용 9092 아님).
    bootstrap-servers: localhost:${KAFKA_PORT:29092}
    consumer:
      group-id: commerce-service
      properties:
        spring.json.trusted.packages: com.shoppinglive.contracts.events

# Redis(localhost:6379)도 로컬 스택에 떠 있지만 아직 이 서비스가 쓰지 않아 설정하지 않는다.
# 캐시/세션이 필요해지는 시점에 spring-boot-starter-data-redis 와 함께 추가한다.

---
# k8s dev 네임스페이스. local 과 같은 미들웨어를 Infra 레포 k8s/overlays/dev/datatier 가 pod 로 띄운다.
# 호스트는 같은 네임스페이스의 Service 이름이고 포트는 클러스터 내부 표준 포트다.
# 자격증명은 지금 Secret 의 값과 같은 기본값을 쓰고, Deployment 가 Secret 을 주입하기 시작하면
# 환경변수가 그대로 이 자리를 덮는다.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://postgres:5432/commerce
    username: ${POSTGRES_USER:shoppinglive}
    password: ${POSTGRES_PASSWORD:changeme}
  kafka:
    # 클러스터 안에서는 브로커의 PLAINTEXT 리스너로 바로 붙는다 (local 의 EXTERNAL 29092 아님).
    bootstrap-servers: kafka:9092
    consumer:
      group-id: commerce-service
      properties:
        spring.json.trusted.packages: com.shoppinglive.contracts.events
