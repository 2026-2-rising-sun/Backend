<!doctype html>
<meta charset="utf-8">
<title>토스 테스트 결제 결과</title>
<!-- 토스가 붙여 주는 값만 보여 준다. 승인(confirm)은 아직 안 됐다. 아래 값을 payment.http 변수에 넣고 4번(승인)을 보낸다. -->
<pre id="out"></pre>
<script>
  const q = new URLSearchParams(location.search);
  const orderId = q.get('orderId') || '';
  out.textContent = q.get('paymentKey')
    ? `결제 인증 완료(아직 승인 전). 제한 시간 안에 승인한다.\n\n` +
      `@ref = ${orderId.replace(/-\d+$/, '')}\n@pgOrderId = ${orderId}\n@paymentKey = ${q.get('paymentKey')}\n@amount = ${q.get('amount')}`
    : `실패: ${q.get('code')} ${q.get('message')}`;
</script>
