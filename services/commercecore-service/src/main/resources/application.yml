spring:
  application:
    name: commercecore-service
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 1000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  config:
    import: classpath:shoppinglive-resilience-defaults.yml
  servlet:
    multipart:
      # 이미지 검증 한도 5MB보다 크게 두어 서비스가 일관된 입력 오류를 반환한다.
      max-file-size: 6MB
      max-request-size: 7MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

shoppinglive:
  outbox:
    relay:
      excluded-topics: [commerce.catalog.snapshots.v1]
      claim:
        enabled: true
  security:
    session:
      base-url: ${MEMBER_SESSION_BASE_URL:}
      service-token: ${COMMERCECORE_MEMBER_SERVICE_TOKEN:}
      connect-timeout: 1s
      read-timeout: 1s
    jwt:
      issuer: shoppinglive-member
      audience: shoppinglive-api
      public-key-set-location: ${MEMBER_JWT_PUBLIC_KEY_SET_LOCATION}
    service-tokens:
      catalog: ${CATALOG_COMMERCECORE_SERVICE_TOKEN}
      live: ${LIVE_COMMERCECORE_SERVICE_TOKEN}

server:
  port: 8083
  tomcat:
    max-swallow-size: 10MB

commercecore:
  catalog:
    inventory-interval: 60s
    inventory-batch-size: 500
  refunds:
    api-enabled: true
    execution-enabled: true
  order:
    expiration:
      duration: PT10M
  image:
    storage:
      dir: ${COMMERCECORE_IMAGE_DIR:${user.home}/.shoppinglive/commercecore-images}
    public-base-url: ${COMMERCECORE_IMAGE_PUBLIC_BASE_URL:/api/commercecore}
  payment-client:
    base-url: ${COMMERCECORE_PAYMENT_BASE_URL:http://localhost:8086}
    service-token: ${COMMERCECORE_PAYMENT_SERVICE_TOKEN:}
    connect-timeout: 1s
    read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"

# 팀원 계약: 주문 생성 때 판매자 주문에 복사한다. 전 판매자 공통 0.1(10%)이며 운영 값은 환경 설정으로 바꾼다(#383).
commerce:
  commission-rate: ${COMMERCE_COMMISSION_RATE:0.1}

---
# Infra 로컬 미들웨어의 commercecore DB를 사용한다. 기존 commerce DB로 연결하지 않는다.
spring:
  config:
    activate:
      on-profile: local
  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:29092}
  datasource:
    url: ${COMMERCECORE_DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/commercecore}
    username: ${POSTGRES_USER:shoppinglive}
    password: ${POSTGRES_PASSWORD:changeme}

shoppinglive:
  security:
    session:
      base-url: ${MEMBER_SESSION_BASE_URL:http://localhost:8081}

---
spring:
  config:
    activate:
      on-profile: dev
  kafka:
    bootstrap-servers: kafka:9092
  datasource:
    url: ${COMMERCECORE_DATABASE_URL:jdbc:postgresql://postgres:5432/commercecore}
    username: ${POSTGRES_USER:shoppinglive}
    password: ${POSTGRES_PASSWORD:changeme}

commercecore:
  payment-client:
    base-url: ${COMMERCECORE_PAYMENT_BASE_URL:http://dev-payment-service:8080}

shoppinglive:
  security:
    session:
      base-url: ${MEMBER_SESSION_BASE_URL:http://dev-member-service:8080}
