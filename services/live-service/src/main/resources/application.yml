spring:
  application:
    name: live-service
  config:
    import: classpath:shoppinglive-resilience-defaults.yml

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: local
