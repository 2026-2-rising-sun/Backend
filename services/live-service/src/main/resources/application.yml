spring:
  application:
    name: live-service
  config:
    import: classpath:shoppinglive-resilience-defaults.yml
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        # heartbeat·구독 재시도·좋아요 전달·좋아요 보관이 서로를 기다리지 않게 한다.
        size: 4
  data:
    redis:
      # Redis 는 실시간 전달에만 쓴다. 장애 시 요청이 오래 붙잡히지 않도록 짧게 끊는다.
      connect-timeout: 1s
      timeout: 1s

server:
  port: 8084

shoppinglive:
  security:
    session:
      base-url: ${MEMBER_SESSION_BASE_URL:}
      service-token: ${LIVE_MEMBER_SERVICE_TOKEN:}
      connect-timeout: 1s
      read-timeout: 1s
    jwt:
      issuer: shoppinglive-member
      audience: shoppinglive-api
      public-key-set-location: ${MEMBER_JWT_PUBLIC_KEY_SET_LOCATION}

live:
  products:
    shopping-token: ${LIVE_SHOPPING_SERVICE_TOKEN:}
    commerce-token: ${LIVE_COMMERCE_SERVICE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"

---
# 접속 정보는 Infra 레포 local/docker-compose.yml 과 같은 환경변수·기본값을 쓴다.
# 값을 바꾸려면 Infra 의 local/.env 와 여기를 함께 고쳐야 한다.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/live
    username: ${POSTGRES_USER:shoppinglive}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    # 스키마는 Flyway 가 소유할 예정이라 Hibernate 가 건드리지 않게 둔다.
    hibernate:
      ddl-auto: none
  data:
    # 여러 인스턴스가 실시간 이벤트(채팅 등)를 나누는 데 쓴다. Infra local/docker-compose.yml 의 redis.
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
  kafka:
    # 호스트에서는 EXTERNAL 리스너로 붙는다 (컨테이너 내부용 9092 아님).
    bootstrap-servers: localhost:${KAFKA_PORT:29092}
    consumer:
      group-id: live-service
      properties:
        spring.json.trusted.packages: com.shoppinglive.contracts.events

# 내부 서비스(shopping·commerce)는 로컬에서도 실제로 호출하고, 과금되는 IVS 만 stub 을 쓴다.
# 상품 조회에는 shopping(8082)·commerce(8083)를 함께 띄워야 한다. mock 서버로 바꿀 때는 URL 만
# 바꾸거나 LIVE_PRODUCTS_SHOPPING_URL / LIVE_PRODUCTS_COMMERCE_URL 로 덮는다.
# stub 은 local/test 에서만 허용되며 운영 프로파일에서 stub 은 기동 실패다.
live:
  products:
    mode: http
    shopping-url: http://localhost:8082
    commerce-url: http://localhost:8083
  ivs:
    mode: stub
    stub-ready: true
    stub-unavailable: false


shoppinglive:
  security:
    session:
      base-url: ${MEMBER_SESSION_BASE_URL:http://localhost:8081}

---
# k8s dev 네임스페이스. local 과 같은 미들웨어를 Infra 레포 k8s/overlays/dev/datatier 가 pod 로 띄운다.
# 호스트는 같은 네임스페이스의 Service 이름이고 포트는 클러스터 내부 표준 포트다.
# 자격증명은 지금 Secret 의 값과 같은 기본값을 쓰고, Deployment 가 Secret 을 주입하기 시작하면
# 환경변수가 그대로 이 자리를 덮는다.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://postgres:5432/live
    username: ${POSTGRES_USER:shoppinglive}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    # 스키마는 Flyway 가 소유할 예정이라 Hibernate 가 건드리지 않게 둔다.
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: redis
      port: 6379
  kafka:
    # 클러스터 안에서는 브로커의 PLAINTEXT 리스너로 바로 붙는다 (local 의 EXTERNAL 29092 아님).
    bootstrap-servers: kafka:9092
    consumer:
      group-id: live-service
      properties:
        spring.json.trusted.packages: com.shoppinglive.contracts.events

# 상품·판매정보는 같은 네임스페이스의 Service 에서 읽는다 (overlay namePrefix dev-).
# mode 는 두 client 가 공유하므로 commerce-url 도 함께 둔다. 판매정보 API(#94)가 배포되기 전까지
# 판매 조회는 UNAVAILABLE 로 실패하지만 기동은 정상이다.
live:
  products:
    mode: http
    shopping-url: http://dev-shopping-service:8080
    commerce-url: http://dev-commerce-service:8080

shoppinglive:
  security:
    session:
      base-url: ${MEMBER_SESSION_BASE_URL:http://dev-member-service:8080}
