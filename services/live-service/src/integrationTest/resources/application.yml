# context-load 테스트는 Docker 없이 CI에서도 돌아야 하므로 in-memory H2를 쓴다.
# 실제 Postgres 연동 확인은 local 프로필로 기동해서 한다.
spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:live;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  # 마이그레이션은 PostgreSQL 전용 구문(partial unique index)을 쓰므로 H2 에서는 돌리지 않는다.
  # 실제 migration 검증은 postgres 프로파일 테스트(LIVE_PG_TEST=1)로 한다.
  flyway:
    enabled: false
  # 닫힌 포트다. 기본 테스트는 Redis 없이 돌며 "Redis 장애에도 기동·채팅 작성 성공"을 함께 검증한다.
  # 실제 Redis 검증은 LIVE_REDIS_TEST=1 테스트로 한다.
  data:
    redis:
      port: 1

live:
  products:
    mode: stub
  ivs:
    mode: stub

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
