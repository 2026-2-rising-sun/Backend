# context-load 테스트는 Docker 없이 CI에서도 돌아야 하므로 in-memory H2를 쓴다.
# 실제 Postgres 연동 확인은 local 프로필로 기동해서 한다.
spring:
  datasource:
    url: jdbc:h2:mem:notification;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
