spring:
  application:
    name: notification-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

shoppinglive:
  security:
    session:
      base-url: ${MEMBER_SESSION_BASE_URL:}
      service-token: ${NOTIFICATION_MEMBER_SERVICE_TOKEN:}
      connect-timeout: 1s
      read-timeout: 1s
    jwt:
      issuer: shoppinglive-member
      audience: shoppinglive-api
      public-key-set-location: ${MEMBER_JWT_PUBLIC_KEY_SET_LOCATION}

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"

---
# 접속 정보는 Infra 레포 local/docker-compose.yml 과 같은 환경변수·기본값을 쓴다.
# 값을 바꾸려면 Infra 의 local/.env 와 여기를 함께 고쳐야 한다.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/notification
    username: ${POSTGRES_USER:shoppinglive}
    password: ${POSTGRES_PASSWORD:changeme}
shoppinglive:
  security:
    session:
      base-url: ${MEMBER_SESSION_BASE_URL:http://localhost:8081}

# Redis(localhost:6379)도 로컬 스택에 떠 있지만 아직 이 서비스가 쓰지 않아 설정하지 않는다.
# 캐시/세션이 필요해지는 시점에 spring-boot-starter-data-redis 와 함께 추가한다.

---
# k8s dev 네임스페이스. local 과 같은 미들웨어를 Infra 레포 k8s/overlays/dev/datatier 가 pod 로 띄운다.
# 호스트는 같은 네임스페이스의 Service 이름이고 포트는 클러스터 내부 표준 포트다.
# 자격증명은 지금 Secret 의 값과 같은 기본값을 쓰고, Deployment 가 Secret 을 주입하기 시작하면
# 환경변수가 그대로 이 자리를 덮는다.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://postgres:5432/notification
    username: ${POSTGRES_USER:shoppinglive}
    password: ${POSTGRES_PASSWORD:changeme}

shoppinglive:
  security:
    session:
      base-url: ${MEMBER_SESSION_BASE_URL:http://dev-member-service:8080}
