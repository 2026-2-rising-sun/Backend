# context-load 테스트는 Docker 없이 CI에서도 돌아야 하므로 in-memory H2를 쓴다.
# 스키마는 운영과 같은 Flyway 마이그레이션으로 만들어 SQL 오류를 CI 에서 잡는다
# (ddl-auto 는 main 설정의 validate 를 그대로 따른다).
# 실제 Postgres 연동 확인은 local 프로필로 기동해서 한다.
spring:
  datasource:
    url: jdbc:h2:mem:shopping;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
