spring:
  application:
    name: shopping-service
  config:
    import: classpath:shoppinglive-resilience-defaults.yml

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"

---
# 접속 정보는 Infra 레포 local/docker-compose.yml 과 같은 환경변수·기본값을 쓴다.
# 값을 바꾸려면 Infra 의 local/.env 와 여기를 함께 고쳐야 한다.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/shopping
    username: ${POSTGRES_USER:shoppinglive}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    # 스키마는 Flyway 가 소유할 예정이라 Hibernate 가 건드리지 않게 둔다.
    hibernate:
      ddl-auto: none

# Redis(localhost:6379)도 로컬 스택에 떠 있지만 아직 이 서비스가 쓰지 않아 설정하지 않는다.
# 캐시/세션이 필요해지는 시점에 spring-boot-starter-data-redis 와 함께 추가한다.
